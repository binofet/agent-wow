syntax = "proto3";
package warcraftbuddy.mail.v1;
option go_package = "github.com/agent-wow/agent-wow/modules/buddy-mail/api;mailv1";
import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

message ListRequest { uint64 mailbox_guid = 1; }
message ClaimRequest {
  string session_id = 1;
  uint64 list_revision = 2;
  uint64 mailbox_guid = 3;
  uint32 mail_id = 4;
}
message StipendMail { uint32 mail_id = 1; uint32 copper = 2; }
enum ClaimStatus {
  CLAIM_NONE = 0;
  CLAIM_REQUESTED = 1;
  CLAIM_CONFIRMED = 2;
  CLAIM_UNCONFIRMED = 3;
  CLAIM_SERVER_REJECTED = 4;
  CLAIM_WRITE_UNCONFIRMED = 5;
}
message ClaimReceipt {
  uint32 mail_id = 1;
  ClaimStatus status = 2;
  bool transport_written = 3;
  bool server_acknowledged = 4;
  bool wallet_increase_observed = 5;
  uint32 baseline_copper = 6;
  uint32 observed_copper = 7;
  uint64 baseline_copper_revision = 8;
  uint64 observed_copper_revision = 9;
  uint32 confirmed_copper = 10;
  uint32 server_error = 11;
  uint32 equipment_error = 12;
}
message BagAttachment {
  uint32 attachment_index = 1;
  uint32 item_guid_low = 2;
  uint32 entry = 3;
  uint32 count = 4;
}
message BagMail {
  uint32 mail_id = 1;
  repeated BagAttachment attachments = 2;
}
message ClaimBagAttachmentRequest {
  string session_id = 1;
  string request_id = 2;
  uint64 list_revision = 3;
  uint64 mailbox_guid = 4;
  uint32 mail_id = 5;
  uint32 attachment_index = 6;
  uint32 item_guid_low = 7;
  uint32 expected_count = 8;
  uint64 expected_inventory_revision = 9;
}
enum BagClaimStatus {
  BAG_CLAIM_NONE = 0;
  BAG_CLAIM_REQUESTED = 1;
  BAG_CLAIM_CONFIRMED = 2;
  BAG_CLAIM_UNCONFIRMED = 3;
  BAG_CLAIM_SERVER_REJECTED = 4;
  BAG_CLAIM_WRITE_UNCONFIRMED = 5;
  BAG_CLAIM_BLOCKED = 6;
}
message BagClaimReceipt {
  ClaimBagAttachmentRequest request = 1;
  BagClaimStatus status = 2;
  string reason = 3;
  bool transport_attempted = 4;
  bool transport_written = 5;
  bool server_acknowledged = 6;
  bool inventory_confirmed = 7;
  uint64 baseline_inventory_revision = 8;
  uint64 observed_inventory_revision = 9;
  uint64 item_guid = 10;
  uint32 entry = 11;
  uint32 count = 12;
  uint32 observed_bag = 13;
  uint32 observed_slot = 14;
  uint32 server_error = 15;
  uint32 equipment_error = 16;
  bool lease_released = 17;
}
message State {
  string session_id = 1;
  string phase = 2;
  bool operation_in_flight = 3;
  bool list_known = 4;
  bool list_current = 5;
  uint64 list_revision = 6;
  uint64 mailbox_guid = 7;
  uint64 list_age_ms = 8;
  uint32 listed_mail_count = 9;
  // Only exact normal console-sender0 GM stationery61 stipend messages.
  // Other owned mail bodies, subjects and attachments are never exposed.
  repeated StipendMail stipends = 10;
  ClaimReceipt last_claim = 11;
  uint64 transport_writes = 12;
  uint64 malformed_packets = 13;
  // One stipend attempt per module instance, including ambiguous writes.
  bool claim_reserved = 14;
  repeated BagMail bag_mails = 15;
  BagClaimReceipt last_bag_claim = 16;
  repeated BagClaimReceipt bag_claims = 17;
  uint32 bags_claim_reserved = 18;
  uint32 bags_claimed = 19;
}
service BuddyMail {
  rpc List(ListRequest) returns (State);
  rpc ClaimStipend(ClaimRequest) returns (State);
  rpc ClaimBagAttachment(ClaimBagAttachmentRequest) returns (State);
  rpc GetState(google.protobuf.Empty) returns (State);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
