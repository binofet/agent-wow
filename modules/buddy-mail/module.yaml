  SMSG_SEND_MAIL_RESULT: /warcraftbuddy.mail.v1.BuddyMail/OnPacket
  SMSG_NEW_WORLD: /warcraftbuddy.mail.v1.BuddyMail/OnPacket
lifecycle:
