api_version: 1
enabled: true
description: Exact owned ordinary armor, mainhand daggers/maces and empty-offhand staves, empty-slot moves and bags, and server-confirmed safe junk sales
requires: [buddy-world, buddy-actions, buddy-trade, buddy-loot, buddy-professions]
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  state: /warcraftbuddy.inventory.v1.BuddyInventory/GetState
  raw_gear_facts: /warcraftbuddy.inventory.v1.BuddyInventory/RawGearFacts
  discover: /warcraftbuddy.inventory.v1.BuddyInventory/Discover
  move: /warcraftbuddy.inventory.v1.BuddyInventory/Move
  equip: /warcraftbuddy.inventory.v1.BuddyInventory/Equip
  equip_gear: /warcraftbuddy.inventory.v1.BuddyInventory/EquipGear
  sell: /warcraftbuddy.inventory.v1.BuddyInventory/Sell
  drink: /warcraftbuddy.inventory.v1.BuddyInventory/Drink
  eat_buff_food: /warcraftbuddy.inventory.v1.BuddyInventory/EatBuffFood
script_api:
  state: {effect: read, description: 'Current owned inventory, raw gear destinations and template facts, current Lua gear comparisons, item-use metadata and observed consumable effects'}
  raw_gear_facts: {effect: read, description: 'Cached owned inventory, equipment, physical gear destinations and template facts only; no dependency reads, refresh or Lua comparison; consumers must verify body and revisions against current observations'}
  equip_gear: {effect: mutation, description: 'Equip the exact selected owned item and destination; legacy requireConservativeUpgrade uses the current Lua gear evaluator'}
  drink: {effect: mutation, description: 'Use an exact selected carried mana drink, or queue a no-item request to the current Lua policy'}
  eat_buff_food: {effect: mutation, description: 'Use exact selected carried buff food, or queue a no-item request to the current Lua policy'}
packets:
  SMSG_ITEM_QUERY_SINGLE_RESPONSE: /warcraftbuddy.inventory.v1.BuddyInventory/OnPacket
  SMSG_CAST_FAILED: /warcraftbuddy.inventory.v1.BuddyInventory/OnPacket
  SMSG_INVENTORY_CHANGE_FAILURE: /warcraftbuddy.inventory.v1.BuddyInventory/OnPacket
  SMSG_SELL_ITEM: /warcraftbuddy.inventory.v1.BuddyInventory/OnPacket
  SMSG_MESSAGECHAT: /warcraftbuddy.inventory.v1.BuddyInventory/OnPacket
lifecycle:
  before_logout: /warcraftbuddy.inventory.v1.BuddyInventory/BeforeLogout
