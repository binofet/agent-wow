syntax = "proto3";
package warcraftbuddy.inventory.v1;
option go_package = "github.com/agent-wow/agent-wow/modules/buddy-inventory/api;inventoryv1";
import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";
import "modules/buddy-world/world.proto";
import "modules/buddy-actions/actions.proto";

message ItemRef { uint32 bag = 1; uint32 slot = 2; uint64 item_guid = 3; uint32 entry = 4; uint32 stack_count = 5; }
message ItemEligibility {
  ItemRef item = 1;
  bool metadata_known = 2;
  bool safe_junk_sale_eligible = 3;
  uint32 unit_sell_price_copper = 4;
  bool normal_bag = 5;
  uint32 container_slots = 6;
  string blocked_reason = 7;
  string name = 8;
  bool gear_equip_eligible = 9;
  uint32 gear_equipment_slot = 10;
  uint64 expected_equipped_item_guid = 11;
  bool conservative_upgrade = 12;
  string gear_blocked_reason = 13;
  ConsumableMetadata consumable = 14;
  GearItemFacts gear_facts = 15;
}
message Operation {
  string request_id = 1;
  string kind = 2;
  string status = 3;
  string reason = 4;
  ItemRef source = 5;
  uint32 destination_bag = 6;
  uint32 destination_slot = 7;
  uint32 equipment_slot = 8;
  uint64 vendor_guid = 9;
  uint32 unit_sell_price_copper = 10;
  uint32 expected_credit_copper = 11;
  bool transport_attempted = 12;
  bool transport_written = 13;
  bool inventory_confirmed = 14;
  bool equipment_confirmed = 15;
  bool copper_confirmed = 16;
  bool server_error_observed = 17;
  uint32 server_error = 18;
  bool lease_released = 19;
  uint64 baseline_inventory_revision = 20;
  uint64 observed_inventory_revision = 21;
  uint64 baseline_copper_revision = 22;
  uint64 observed_copper_revision = 23;
  uint32 baseline_copper = 24;
  uint32 observed_copper = 25;
  uint64 baseline_equipment_revision = 26;
  uint64 observed_equipment_revision = 27;
  uint64 displaced_item_guid = 28;
}
message State {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 revision = 3;
  bool inventory_known = 4;
  uint64 inventory_revision = 5;
  repeated warcraftbuddy.world.v1.InventoryBag inventory_bags = 6;
  bool copper_known = 7;
  uint32 copper = 8;
  uint64 copper_revision = 9;
  bool active = 10;
  Operation operation = 11;
  repeated ItemEligibility items = 12;
  string blocked_reason = 13;
  uint64 transport_writes = 14;
  uint64 malformed_packets = 15;
  string limitation = 16;
  bool closing = 17;
  bool equipment_known = 18;
  uint64 equipment_revision = 19;
  repeated warcraftbuddy.world.v1.EquipmentSlotState equipment = 20;
  bool drinking_supported = 21;
  GroupRollReceipt last_group_roll = 22;
  bool food_buff_supported = 23;
  bool buff_food_available = 24;
  optional uint32 mana_drink_count = 25;
  ConsumableUse last_consumable_use = 40;
  ConsumableContext consumable_context = 41;
  GearContext gear_context = 42;
}

// Static template facts and exact legal destinations; no upgrade preference.
message GearStat { uint32 type = 1; sint32 value = 2; }
message GearDamage { float minimum = 1; float maximum = 2; uint32 school = 3; }
message GearTemplate {
  uint32 item_id = 1; bool available = 2; string name = 3;
  uint32 item_class = 4; uint32 subclass = 5; uint32 inventory_type = 6;
  uint32 quality = 7; uint32 armor = 8; repeated GearStat stats = 9;
  repeated GearDamage damages = 10; uint32 delay_ms = 11;
  repeated uint32 resistances = 12; bool armor_comparison_known = 13;
  uint32 flags = 14; uint32 flags2 = 15; bool has_spell = 16;
  uint32 scaling_distribution = 17; uint32 scaling_value = 18;
  uint32 required_level = 19;
}
message GearDestination {
  uint32 equipment_slot = 1; uint64 expected_equipped_item_guid = 2;
  bool eligible = 3; string blocked_reason = 4;
}
message GearItemFacts {
  bool enhancements_known = 1; bool has_enhancements = 2;
  bool durability_known = 3; uint32 durability = 4; uint32 max_durability = 5;
  repeated GearDestination destinations = 6;
}
message GearContext {
  bool class_known = 1; uint32 class_id = 2;
  bool race_known = 3; uint32 race_id = 4; bool level_known = 5; uint32 level = 6;
  map<string,GearTemplate> templates = 7;
  string policy_revision = 8;
  string policy_error = 9;
}

// Deployed State22 contract. New roll controls use their separate Roll* types.
message GroupRollReceipt {
  uint64 roll_guid = 1; uint32 item_entry = 2; uint32 loot_slot = 3;
  uint32 offered_mask = 4; string choice = 5; string phase = 6;
  string reason = 7; bool transport_written = 8; bool server_vote_observed = 9;
}
message ConsumableAuraEffect { uint32 aura_type = 1; int32 misc_value = 2; int32 points = 3; int32 dice = 4; }
message ConsumableSpell {
  uint32 spell_id = 1; string name = 2; int32 mana_per_tick = 3;
  uint32 food_aura_spell_id = 4; uint32 food_delay_ms = 5;
  repeated ConsumableAuraEffect food_effects = 6;
  bool drink_supported = 7; bool food_supported = 8;
}
message ConsumableMetadata { bool usable = 1; string blocked_reason = 2; repeated ConsumableSpell spells = 3; }
message ConsumableContext {
  bool body_ready = 1; bool dungeon = 2;
  warcraftbuddy.actions.v1.PlayerAuras self_auras = 3;
  bool food_buff_present = 4; bool food_buff_known = 5;
}
message ConsumableUse {
  string request_id = 1; string kind = 2; ItemRef source = 3;
  uint32 spell_id = 4; uint32 aura_spell_id = 5;
  uint64 baseline_inventory_revision = 6; uint64 observed_inventory_revision = 7;
  bool transport_attempted = 8; bool transport_written = 9;
  bool inventory_confirmed = 10; bool aura_observed = 11;
  bool server_rejected = 12; uint32 server_error = 13; string phase = 14;
  uint64 baseline_aura_revision = 15;
}
message DiscoverRequest { uint32 vendor_entry = 1; uint64 vendor_guid = 2; }
message Vendor { warcraftbuddy.world.v1.CreatureState creature = 1; bool interactable = 2; string blocked_reason = 3; double distance = 4; }
message Discovery { State state = 1; repeated Vendor nearby = 2; }
message MoveRequest {
  string session_id = 1; string request_id = 2; uint64 expected_revision = 3; uint64 expected_inventory_revision = 4;
  ItemRef source = 5; uint32 destination_bag = 6; uint32 destination_slot = 7; uint64 expected_destination_item_guid = 8;
}
message EquipRequest {
  string session_id = 1; string request_id = 2; uint64 expected_revision = 3; uint64 expected_inventory_revision = 4;
  ItemRef source = 5; uint32 equipment_slot = 6; uint64 expected_container_guid = 7;
}
message SellRequest {
  string session_id = 1; string request_id = 2; uint64 expected_revision = 3; uint64 expected_inventory_revision = 4;
  ItemRef source = 5; uint64 vendor_guid = 6; uint32 expected_unit_sell_price_copper = 7; uint64 expected_copper_revision = 8;
}
message EquipGearRequest {
  string session_id = 1; string request_id = 2; uint64 expected_revision = 3; uint64 expected_inventory_revision = 4;
  ItemRef source = 5; uint32 equipment_slot = 6; uint64 expected_equipment_revision = 7;
  uint64 expected_equipped_item_guid = 8; bool require_conservative_upgrade = 9;
}
message DrinkRequest {
  string session_id = 1; uint64 self_guid = 2;
  ItemRef source = 3; uint32 spell_id = 4; uint64 expected_inventory_revision = 5; string request_id = 6;
}
message DrinkReceipt {
  string session_id = 1; uint64 self_guid = 2; uint64 item_guid = 3;
  uint32 item_entry = 4; uint32 spell_id = 5; uint32 stack_count_before = 6;
  bool transport_written = 7; string reason = 8; uint32 baseline_mana = 9;
  uint64 baseline_inventory_revision = 10; string request_id = 11; ConsumableUse operation = 12;
}
message EatBuffFoodRequest {
  string session_id = 1; uint64 self_guid = 2;
  ItemRef source = 3; uint32 spell_id = 4; uint64 expected_inventory_revision = 5; string request_id = 6;
}
message EatBuffFoodReceipt {
  string session_id = 1; uint64 self_guid = 2; uint32 item_entry = 3;
  uint32 spell_id = 4; uint32 food_aura_spell_id = 5; bool transport_written = 6;
  uint32 time_until_buff_ms = 7; string request_id = 8; ConsumableUse operation = 9; string reason = 10;
}
service BuddyInventory {
  rpc GetState(google.protobuf.Empty) returns (State);
  rpc Discover(DiscoverRequest) returns (Discovery);
  rpc Move(MoveRequest) returns (State);
  rpc Equip(EquipRequest) returns (State);
  rpc EquipGear(EquipGearRequest) returns (State);
  rpc Sell(SellRequest) returns (State);
  rpc Drink(DrinkRequest) returns (DrinkReceipt);
  rpc EatBuffFood(EatBuffFoodRequest) returns (EatBuffFoodReceipt);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
