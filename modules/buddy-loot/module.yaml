api_version: 1
enabled: true
description: Exact observed loot-window actions and retained quest-container opening; ordinary corpse and window choices belong to Lua
requires: [buddy-world, buddy-actions, buddy-party]
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  enable: /warcraftbuddy.loot.v1.BuddyLoot/Enable
  state: /warcraftbuddy.loot.v1.BuddyLoot/GetState
  observe_corpses: /warcraftbuddy.loot.v1.BuddyLoot/ObserveCorpses
  open_corpse: /warcraftbuddy.loot.v1.BuddyLoot/OpenCorpse
  close_corpse: /warcraftbuddy.loot.v1.BuddyLoot/CloseCorpse
  take_money: /warcraftbuddy.loot.v1.BuddyLoot/TakeMoney
  take_slot: /warcraftbuddy.loot.v1.BuddyLoot/TakeSlot
  resume_source: /warcraftbuddy.loot.v1.BuddyLoot/ResumeSource
script_api:
  enable: {effect: mutation, description: Legacy named quest/container scheduling metadata; ordinary corpse choice remains in Lua}
  state: {effect: read, description: Read current native loot-window and packet settlement facts}
  observe_corpses: {effect: read, description: 'Read observed corpse/window, bound quest-container, position, capacity and exact receipts without choosing a source'}
  open_corpse: {effect: mutation, description: 'Open one exact current in-range corpse, bound to body, source and inventory revisions and an idempotent request ID'}
  close_corpse: {effect: mutation, description: Release an exact bound corpse or observed quest-container window and yield body custody without replaying uncertain mutations}
  take_money: {effect: mutation, description: Take observed unrequested money from the exact bound window with an idempotent request ID}
  take_slot: {effect: mutation, description: Take one caller-selected permitted slot bound to source window revision item count inventory revision and request ID}
  resume_source: {effect: mutation, description: Clear one exact settled container capacity pause using current body source gather generation and inventory revision; never clears uncertain mutations or sends game packets}
packets:
  SMSG_CAST_FAILED: /warcraftbuddy.loot.v1.BuddyLoot/OnPacket
  SMSG_LOOT_RESPONSE: /warcraftbuddy.loot.v1.BuddyLoot/OnPacket
  SMSG_LOOT_RELEASE_RESPONSE: /warcraftbuddy.loot.v1.BuddyLoot/OnPacket
  SMSG_LOOT_REMOVED: /warcraftbuddy.loot.v1.BuddyLoot/OnPacket
  SMSG_LOOT_CLEAR_MONEY: /warcraftbuddy.loot.v1.BuddyLoot/OnPacket
  SMSG_LOOT_MONEY_NOTIFY: /warcraftbuddy.loot.v1.BuddyLoot/OnPacket
  SMSG_ITEM_PUSH_RESULT: /warcraftbuddy.loot.v1.BuddyLoot/OnPacket
  SMSG_INVENTORY_CHANGE_FAILURE: /warcraftbuddy.loot.v1.BuddyLoot/OnPacket
lifecycle:
  before_logout: /warcraftbuddy.loot.v1.BuddyLoot/BeforeLogout
