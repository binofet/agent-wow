syntax = "proto3";
package warcraftbuddy.loot.v1;
option go_package = "github.com/agent-wow/agent-wow/modules/buddy-loot/api;lootv1";
import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";
import "modules/buddy-world/world.proto";
import "modules/buddy-actions/actions.proto";
// Legacy named quest/container scheduler only; ordinary corpse policy is Lua.
message EnableRequest { bool enabled = 1; }
message ItemReceipt { uint32 item_id = 1; uint32 count = 2; uint32 loot_slot = 3; }

enum GatherStatus {
  GATHER_NONE = 0;
  GATHER_REQUESTED = 1;
  GATHER_ITEM_STORED = 2;
  GATHER_CONFIRMED = 3;
  GATHER_SERVER_REJECTED = 4;
  GATHER_UNCONFIRMED = 5;
}
message GatherReceipt {
  uint64 id = 1;
  uint64 object_guid = 2;
  uint32 object_entry = 3;
  uint32 quest_id = 4;
  uint32 item_id = 5;
  uint32 count = 6;
  GatherStatus status = 7;
  bool opening_transport_written = 8;
  bool loot_window_observed = 9;
  bool item_push_observed = 10;
  bool slot_removed = 11;
  bool release_observed = 12;
  uint64 baseline_quest_log_revision = 13;
  uint64 observed_quest_log_revision = 14;
  bool own_quest_complete_observed = 15;
  string reason = 16;
}

message State {
  bool enabled = 1;
  string phase = 2;
  string reason = 3;
  uint64 pending_corpse_guid = 4;
  uint64 last_corpse_guid = 5;
  uint64 transport_writes = 6;
  uint64 loot_windows_observed = 7;
  // Own SMSG_ITEM_PUSH_RESULT matched to our pending ordinary loot request.
  uint64 items_stored_confirmed = 8;
  uint64 loot_slots_removed = 9;
  uint64 money_awarded_notified = 10;
  uint64 releases_observed = 11;
  uint32 last_loot_error = 12;
  uint32 last_inventory_error = 13;
  uint64 malformed_packets = 14;
  repeated ItemReceipt recent_items = 15;
  uint64 enabled_remaining_ms = 16;
  uint64 pending_game_object_guid = 17;
  GatherReceipt last_gather = 18;
  string session_id = 19;
  bool inventory_paused = 20;
  CapacityPause capacity_pause = 21;
}
// Recorded capacity refusal for one retained container operation. This is
// evidence, not a native decision about when another attempt should start.
message CapacityPause { uint64 source_guid = 1; uint64 gather_id = 2; uint64 inventory_revision = 3; }
message ResumeSourceRequest {
  string session_id = 1; uint64 self_guid = 2; uint64 source_guid = 3;
  uint64 gather_id = 4; uint64 expected_inventory_revision = 5;
}
message ResumeSourceReceipt {
  string session_id = 1; uint64 self_guid = 2; uint64 source_guid = 3;
  uint64 gather_id = 4; uint64 inventory_revision = 5; bool cleared = 6;
}
// Exact source identity, not a request for the native module to choose a corpse.
message OpenCorpseRequest {
  string session_id = 1; uint64 self_guid = 2; uint64 corpse_guid = 3;
  string request_id = 4; uint64 expected_position_revision = 5;
  uint64 expected_corpse_revision = 6; uint64 expected_inventory_revision = 7;
}
message CloseCorpseRequest { string session_id = 1; uint64 self_guid = 2; uint64 corpse_guid = 3; bool retire_unconfirmed = 4; }
message CorpseOperation {
  string session_id = 1; uint64 self_guid = 2; uint64 corpse_guid = 3; string request_id = 4;
  string phase = 5; string reason = 6; bool opening_transport_attempted = 7;
  bool opening_transport_written = 8; bool window_observed = 9; bool release_observed = 10;
  bool terminal = 11;
}
message CorpseObservation {
  string session_id = 1; uint64 self_guid = 2;
  warcraftbuddy.world.v1.PlayerState self = 3;
  warcraftbuddy.actions.v1.State actions = 4;
  repeated warcraftbuddy.world.v1.CreatureState corpses = 5;
  repeated warcraftbuddy.world.v1.CreatureState nearby_creatures = 6;
  bool inventory_known = 7; uint64 inventory_revision = 8; uint32 general_free_slots = 9;
  State state = 10; CorpseOperation operation = 11; repeated uint64 retired_sources = 12;
  warcraftbuddy.world.v1.PlayerState owner = 13;
  // Raw cached observation of the last caller-selected source, including life.
  warcraftbuddy.world.v1.CreatureState source_observation = 14;
  LootWindow window = 15;
  bool quest_log_known = 16;
  repeated warcraftbuddy.world.v1.QuestLogEntry quest_log = 17;
  repeated QuestItemRequirement quest_requirements = 18;
  bool item_counts_known = 19;
  repeated OwnedItemCount item_counts = 20;
}
message QuestItemRequirement { uint32 quest_id = 1; uint32 item_id = 2; uint32 count = 3; }
message OwnedItemCount { uint32 item_id = 1; uint64 count = 2; }
message LootSlot { uint32 slot = 1; uint32 item_id = 2; uint32 count = 3; uint32 slot_type = 4; bool removed = 5; }
message LootWindow {
  uint64 corpse_guid = 1; string open_request_id = 2; uint64 revision = 3;
  bool observed = 4; uint32 money = 5; bool money_requested = 6; bool money_cleared = 7;
  repeated LootSlot slots = 8; LootMutation mutation = 9;
}
message TakeLootRequest {
  string session_id = 1; uint64 self_guid = 2; uint64 corpse_guid = 3;
  string open_request_id = 4; uint64 window_revision = 5; string request_id = 6;
  uint32 slot = 7; uint32 expected_item_id = 8; uint32 expected_count = 9;
  uint64 expected_inventory_revision = 10;
}
message LootMutation {
  string session_id = 1; uint64 self_guid = 2; uint64 corpse_guid = 3;
  string open_request_id = 4; uint64 window_revision = 5; string request_id = 6;
  string kind = 7; uint32 slot = 8; uint32 item_id = 9; uint32 count = 10;
  bool transport_attempted = 11; bool transport_written = 12;
  bool slot_removed = 13; bool item_push_observed = 14; bool money_cleared = 15;
  bool server_rejected = 16; uint32 inventory_error = 17; bool terminal = 18;
  bool inventory_delta_observed = 19;
}
service BuddyLoot {
  rpc Enable(EnableRequest) returns (State);
  rpc GetState(google.protobuf.Empty) returns (State);
  rpc ObserveCorpses(google.protobuf.Empty) returns (CorpseObservation);
  rpc OpenCorpse(OpenCorpseRequest) returns (CorpseOperation);
  rpc CloseCorpse(CloseCorpseRequest) returns (CorpseOperation);
  rpc TakeMoney(TakeLootRequest) returns (LootMutation);
  rpc TakeSlot(TakeLootRequest) returns (LootMutation);
  rpc ResumeSource(ResumeSourceRequest) returns (ResumeSourceReceipt);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
