script_api:
  summoning_observation: {effect: read, description: Observe the latest summoning object use and genuine incoming player summon offer for this body}
  use_summoning_object: {effect: mutation, description: Use an exact nearby ritual or meeting stone once with the current group and observed selection}
  respond_to_summon: {effect: mutation, description: Answer the exact live summon offer once. Verify arrival through World observations}
  talent_state: {effect: read, description: Read complete normal player talent free-points/spec/rank/glyph facts and exact attempt receipts for the current body}
  learn_talent: {effect: mutation, description: Spend one caller-selected normal talent/rank request against an exact current body/spec/revision; acknowledgement does not prove the rank was learned}
  cast_spell: {effect: mutation, description: 'Issue one normal cast of any exact learned spell with composable current-visit targets; server validates spell requirements and effects remain unverified'}
  cancel_spell: {effect: mutation, description: 'Cancel only the exact current owned cast or channel operation; an unknown cancellation is never replayed'}
  flightpath_reference: {effect: read, description: Read exact pinned node and outgoing path references; labels base prices and coordinates prove no live route fare or arrival}
  flightpath_observation: {effect: read, description: Observe bound flightmaster queries and activation custody; accepted activation proves no flight start fare or arrival}
  query_flightpath: {effect: mutation, description: Issue one exact status or learn-menu query to an observed nearby flightmaster under an exploration lease; never activates travel or spends money}
  activate_flightpath: {effect: mutation, description: Request one Lua-selected direct flight hop with exact observed menu and wallet bindings and explicit unknown-fare acceptance; server may spend copper and unresolved attempts never replay}
  settle_flightpath: {effect: mutation, description: Settle one retained booking against exact actual ground observations and its fresh server destination-node menu; never sends another booking or clears delivery history}
  adopt_flightpath_transfer: {effect: mutation, description: Bind one observed adjacent segment to the existing known accepted booking through native World supersession; preserves original acceptance and unknown history and sends no booking}
  acquire_movement: {effect: mutation, description: Acquire or renew finite idle and follow movement custody while preserving healing defense casting and explicit actor movement}
  release_movement: {effect: mutation, description: Release the exact session body and owner movement token without changing standing follow intent}
  select_target: {effect: mutation, description: Set or clear normal client UI selection for an observed local target or explicitly bound online group member}
  approach_target: {effect: mutation, description: Move one physical navigation step toward the exact observed target and caller-selected range}
  move_body: {effect: mutation, description: Execute one body-relative step or hop at observed speed. Use ground_or_water for measured forward input or follow_water for a verified crossing to the observed lower owner}
  break_control: {effect: mutation, description: Execute the exact learned or equipped fear break against the selected observed self aura without movement preparation}
  interrupt_cast: {effect: mutation, description: Cast one exact learned interrupt on the selected observed enemy cast revision}
  area_trigger_reference: {effect: read, description: Static current-map trigger volumes for explicit destination intent; no route or realm admission proof}
  notify_area_trigger: {effect: mutation, description: One exact actor-in-volume normal trigger notification under current idle custody and scoped movement authority}
  area_trigger_observation: {effect: read, description: Retained trigger delivery and adjacent observed destination facts; no party-copy or regroup claim}
  plan_route_leg: {effect: read, description: Physically verified next endpoint along a complete bounded same-map corridor; no movement authority}
  status: {effect: read}
  behavior: {effect: read}
  spell_toolkit: {effect: read}
  step_movement_points: {effect: mutation, description: One guarded bounded ground input away from current actor-authored temporary points}
  set_movement_points: {effect: mutation, description: Replace current body-visit temporary exclusion data without sending movement}
  set_follow_formation: {effect: mutation, description: Refresh a finite exact Lua follow destination without moving or changing standing intent}
  set_portal_catchup: {effect: mutation, description: Refresh finite ordered Lua portal catchup candidates bound to a witnessed entrance and current pose without moving}
  follow: {effect: mutation}
  assist: {effect: mutation, description: Legacy starter intent only; ordinary combat and defense are always selected by the attached Lua policy}
  engage_npc: {effect: mutation, description: Queue explicit target intent in the current attached Lua policy; false cancels only that request and never disables defense}
  resurrect_once: {effect: mutation, description: Cast a learned resurrection spell once on an explicitly selected observed dead same-faction player or their corpse}
  accept_resurrection: {effect: mutation, description: Accept a genuine pending resurrection offer from the explicitly selected caster}
  pick_lock: {effect: mutation, description: Use learned Pick Lock on an observed locked chest and report the server loot window}
  create_item: {effect: mutation, description: Cast one exact learned direct item creation spell on self and report inventory confirmation}
  cast_self: {effect: mutation, description: Cast one exact learned spell on the current body and report cast or channel observations}
  healing_options: {effect: read, description: Observe injured eligible patients and available learned heal ranks}
  self_mana_observation: {effect: read, description: 'Observe current caster resources, activity, nearby attackers and learned spell mechanics'}
  encounter_observation: {effect: read, description: 'Observe the current encounter body and map visit with raw attack and selection facts for Lua engagement policy, party marks and learned spell facts'}
  cast_heal: {effect: mutation, description: Cast the exact learned heal on the selected observed eligible player}
  cast_offense: {effect: mutation, description: Cast one exact learned damage spell on the selected current attacker}
  cast_cleanse: {effect: mutation, description: 'Cast one exact learned cleanse on a selected observed harmful aura without choosing a patient or rank'}
  melee: {effect: mutation, description: Start autoattack on the selected observed creature independent of hit range or facing; stop the exact acknowledged own target}
  polymorph: {effect: mutation, description: Prepare or cast an exact learned Polymorph on a selected observed creature}
  sap: {effect: mutation, description: Prepare or cast an exact learned Sap on a selected observed creature}
  heal_once: {effect: mutation, description: Queue a healing request in the current attached Lua policy; returned State acknowledges input rather than a cast. Exact callers use cast_heal}
  cast_buff: {effect: mutation, description: 'Cast one exact learned friendly aura spell on the selected observed player; Lua owns rank, usefulness and refresh decisions'}
  buffs: {effect: mutation, description: 'Compatibility input: enable queues a useful-buff check in current Lua; disable clears legacy status while shared Lua maintenance stays active'}
  reload_behavior: {effect: mutation}
  acquire_interaction: {effect: mutation}
  acquire_idle_interaction: {effect: mutation}
  release_interaction: {effect: mutation, description: 'Release the exact caller-selected interaction lease after normal STOP; optional session/body/visit guards bind current Lua requests'}
  approach_loot: {effect: mutation}
  approach_quest: {effect: mutation}
  travel_quest: {effect: mutation}
  travel_trainer: {effect: mutation}
  travel_vendor: {effect: mutation}
  travel_to: {effect: mutation}
  exit_crypt: {effect: mutation}
  practice: {effect: mutation}
  fargodeep_encounter: {effect: mutation}
  recovery: {effect: mutation}
  release_spirit: {effect: mutation}
  query_corpse: {effect: mutation}
  approach_corpse: {effect: mutation}
  reclaim_corpse: {effect: mutation}
