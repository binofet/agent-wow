api_version: 1
enabled: true
description: Bounded map-aware ground following and class-aware priest mage rogue or warlock assistance to fixed owner Joel
requires: [buddy-world, buddy-party]
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  follow: /warcraftbuddy.actions.v1.BuddyActions/Follow
  healing: /warcraftbuddy.actions.v1.BuddyActions/Healing
  assist: /warcraftbuddy.actions.v1.BuddyActions/Assist
  heal_once: /warcraftbuddy.actions.v1.BuddyActions/HealOnce
  status: /warcraftbuddy.actions.v1.BuddyActions/Status
  buffs: /warcraftbuddy.actions.v1.BuddyActions/Buffs
  spell_toolkit: /warcraftbuddy.actions.v1.BuddyActions/SpellToolkit
  acquire_interaction: /warcraftbuddy.actions.v1.BuddyActions/AcquireInteraction
  release_interaction: /warcraftbuddy.actions.v1.BuddyActions/ReleaseInteraction
  approach_loot: /warcraftbuddy.actions.v1.BuddyActions/ApproachLoot
  approach_quest: /warcraftbuddy.actions.v1.BuddyActions/ApproachQuest
  travel_quest: /warcraftbuddy.actions.v1.BuddyActions/TravelQuest
  travel_trainer: /warcraftbuddy.actions.v1.BuddyActions/TravelTrainer
  travel_vendor: /warcraftbuddy.actions.v1.BuddyActions/TravelVendor
  travel_to: /warcraftbuddy.actions.v1.BuddyActions/TravelTo
  exit_crypt: /warcraftbuddy.actions.v1.BuddyActions/ExitCrypt
  practice: /warcraftbuddy.actions.v1.BuddyActions/Practice
  fargodeep_encounter: /warcraftbuddy.actions.v1.BuddyActions/FargodeepEncounter
  recovery: /warcraftbuddy.actions.v1.BuddyActions/Recovery
packets:
  SMSG_RESURRECT_REQUEST: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_AURA_UPDATE: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_AURA_UPDATE_ALL: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_TRANSFER_PENDING: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_NEW_WORLD: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  MSG_CORPSE_QUERY: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_CORPSE_RECLAIM_DELAY: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_DEATH_RELEASE_LOC: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_INITIAL_SPELLS: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_LEARNED_SPELL: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
