api_version: 1
enabled: true
description: Bounded outdoor following and class-aware priest mage or rogue assistance to fixed owner Joel
requires: [buddy-world]
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  follow: /warcraftbuddy.actions.v1.BuddyActions/Follow
  healing: /warcraftbuddy.actions.v1.BuddyActions/Healing
  assist: /warcraftbuddy.actions.v1.BuddyActions/Assist
  heal_once: /warcraftbuddy.actions.v1.BuddyActions/HealOnce
  status: /warcraftbuddy.actions.v1.BuddyActions/Status
  acquire_interaction: /warcraftbuddy.actions.v1.BuddyActions/AcquireInteraction
  release_interaction: /warcraftbuddy.actions.v1.BuddyActions/ReleaseInteraction
  approach_loot: /warcraftbuddy.actions.v1.BuddyActions/ApproachLoot
  approach_quest: /warcraftbuddy.actions.v1.BuddyActions/ApproachQuest
  travel_quest: /warcraftbuddy.actions.v1.BuddyActions/TravelQuest
  practice: /warcraftbuddy.actions.v1.BuddyActions/Practice
packets:
  SMSG_INITIAL_SPELLS: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_LEARNED_SPELL: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_SUPERCEDED_SPELL: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_REMOVED_SPELL: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_CAST_FAILED: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_SPELL_START: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_SPELL_GO: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_SPELL_FAILURE: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_SPELL_FAILED_OTHER: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_SPELLNONMELEEDAMAGELOG: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_ATTACKERSTATEUPDATE: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_ATTACKSTART: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_ATTACKSTOP: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_ITEM_QUERY_SINGLE_RESPONSE: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_PARTYKILLLOG: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
lifecycle:
  before_logout: /warcraftbuddy.actions.v1.BuddyActions/BeforeLogout
