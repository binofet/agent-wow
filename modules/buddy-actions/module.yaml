  SMSG_SPELL_START: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_SPELL_GO: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
  SMSG_SPELL_FAILURE: /warcraftbuddy.actions.v1.BuddyActions/OnPacket
