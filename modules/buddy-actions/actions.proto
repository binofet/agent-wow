syntax = "proto3";
package warcraftbuddy.actions.v1;
option go_package = "github.com/agent-wow/agent-wow/modules/buddy-actions/api;actionsv1";
import "api/module/v1/session.proto";
import "modules/buddy-party/party.proto";
import "modules/buddy-world/world.proto";
import "google/protobuf/empty.proto";

message ToggleRequest { bool enabled = 1; }
// Finite custody of idle/follow movement only. Does not disable standing
// intents, healing, defense, casting or explicit actor movement capabilities.
message MovementOwnerRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  string owner = 3;
  string token = 4; // exact token renews this owner; empty acquires a new lease
  uint32 lease_ms = 5; // caller chooses a positive finite TTL
}
message MovementOwnerRelease {
  string session_id = 1;
  uint64 self_guid = 2;
  string owner = 3;
  string token = 4;
}
message MovementOwnerState {
  bool active = 1;
  string owner = 2;
  uint64 remaining_ms = 3;
  uint64 revision = 4;
}
message MovementOwnerLease {
  string token = 1; // never included in ordinary observations
  State state = 2;
}
// Normal client UI selection only; does not change the Lua combat queue.
message SelectTargetRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  // Zero clears selection. Nonzero must be an observed same-map unit/corpse.
  uint64 target_guid = 3;
}
message SelectTargetResponse {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 target_guid = 3;
  bool transport_written = 4;
  // True only when a subsequent World read changed to the requested target.
  // A successful transport write alone does not establish an observed effect.
  bool selection_observed = 5;
  bool observed_target_known = 6;
  uint64 observed_target_guid = 7;
  string phase = 8;
}
// Explicitly select one currently observed NPC; never selects another target.
message EngageNPCRequest { bool enabled = 1; uint64 target_guid = 2; }
message EngageNPCState {
  bool active = 1;
  uint64 target_guid = 2;
  string phase = 3;
  uint64 lease_remaining_ms = 4;
}
// Pure Lua decisions change only subsequent selections; transport stays native.
message BehaviorReloadRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  string expected_revision = 3;
  string source = 4;
  bool use_builtin = 5;
}
message BehaviorStatus {
  string session_id = 1;
  uint64 self_guid = 2;
  string revision = 3;
  string last_good_revision = 4;
  string quarantined_revision = 5;
  string last_error = 6;
  uint64 evaluations = 7;
  uint64 failures = 8;
  string last_rejected_decision = 9;
}
// One explicitly coordinated observed Fargodeep encounter; never chooses a target.
message FargodeepEncounterRequest {
  bool enabled = 1;
  uint64 target_guid = 2;
  uint64 engager_guid = 3;
  uint64 expected_quest_log_revision = 4;
  string session_id = 5;
}
message FargodeepEncounterState {
  bool active = 1;
  uint64 target_guid = 2;
  uint64 engager_guid = 3;
  string phase = 4;
  uint64 remaining_ms = 5;
}
message ClientPosition {
  bool known = 1;
  bool map_known = 2;
  uint32 map_id = 3;
  float x = 4;
  float y = 5;
  float z = 6;
  float orientation = 7;
  // True when these coordinates come from this client's successful movement
  // transport write. This is an estimate, not a server movement acknowledgement.
  bool estimated = 8;
  uint64 age_ms = 9;
  uint64 revision = 10;
}
message InteractionRequest {
  // Fixed coordination labels: loot, quests, trade, training, mail, professions, exploration.
  string owner = 1;
  // Required only to renew an existing lease; never returned by Status.
  string token = 2;
  // 0 means15000; allowed1000..30000ms.
  uint32 lease_ms = 3;
  // Explicit non-destructive gathering/exploration guard; immutable per token.
  // Only professions and exploration may request it. Defense intent stays on.
  bool harvest = 4;
}
message InteractionRelease { string owner = 1; string token = 2; }
message ApproachLootRequest {
  string token = 1;
  // Exactly one observed target: an eligible corpse or own Milly harvest crate.
  uint64 corpse_guid = 2;
  uint64 game_object_guid = 3;
}
message ApproachQuestRequest { string token = 1; uint64 npc_guid = 2; }
// Movement only: a caller destination grants no NPC presence or interaction proof.
message TravelToRequest {
  string token = 1;
  uint32 map_id = 2;
  float x = 3;
  float y = 4;
  float z = 5;
  // 0 preserves the default3yd stop. Explicit0.5..3yd requires the verified
  // route endpoint to fit this radius; it grants no floor/layer tolerance.
  float arrival_distance = 6;
}
// Read-only guidance. TravelTo independently replans the returned endpoint
// under its normal movement custody and physical checks.
message PlanRouteLegRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 expected_position_revision = 3;
  uint32 map_id = 4;
  float x = 5;
  float y = 6;
  float z = 7;
}
message RouteLeg {
  string session_id = 1;
  uint64 self_guid = 2;
  uint32 map_id = 3;
  ClientPosition start = 4;
  // Planned geometry only, not an observed player pose or movement receipt.
  // Age and position revision are deliberately unset.
  ClientPosition endpoint = 5;
  float path_length = 6;
  uint32 point_count = 7;
  bool goal_reached = 8;
  uint64 server_position_revision = 9;
}
// An owned quests lease permits only the fixed, measured crypt exit route.
message ExitCryptRequest { string token = 1; }
message InteractionLease { string token = 1; State state = 2; }
message RecoveryState {
  bool enabled = 1;
  bool active = 2;
  string phase = 3;
  string reason = 4;
  uint64 death_epoch = 5;
  bool release_attempted = 6;
  bool release_written = 7;
  bool ghost_observed = 8;
  bool corpse_query_known = 9;
  bool corpse_found = 10;
  ClientPosition corpse_location = 11;
  uint32 corpse_map_id = 12;
  uint64 corpse_guid = 13;
  ClientPosition graveyard_location = 14;
  bool reclaim_delay_known = 15;
  uint64 reclaim_delay_remaining_ms = 16;
  bool reclaim_attempted = 17;
  bool reclaim_written = 18;
  bool alive_observed = 19;
  bool rested = 20;
  bool movement_unconfirmed = 21;
  uint32 verified_legs = 22;
  // Reserved before the exact query write; unknown transport is never replayed.
  bool corpse_query_pending = 23;
  RecoveryCorpse own_corpse = 24;
  bool ghost_movement_supported = 25;
  uint64 corpse_query_revision = 26;
  bool motion_pending = 27;
  ResurrectionOffer resurrection_offer = 28;
}
// A genuine SMSG_RESURRECT_REQUEST, not a chosen recovery action. Age is a
// local elapsed observation; an optional server timer is reclaim delay, not
// an invented offer expiry. Acceptance is not evidence that life returned.
message ResurrectionOffer {
  uint64 caster_guid = 1;
  uint64 revision = 2;
  uint64 death_epoch = 3;
  uint64 age_ms = 4;
  bool response_attempted = 5;
  bool response_written = 6;
  bool outcome_unknown = 7;
  bool resurrection_sickness = 8;
  optional uint32 reclaim_delay_ms = 9;
}
message RecoveryCorpse {
  uint64 guid = 1;
  uint64 owner_guid = 2;
  bool present = 3;
  ClientPosition position = 4;
  bool flags_known = 5;
  uint32 flags = 6;
}
message CorpseApproachRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 death_epoch = 3;
  uint64 expected_position_revision = 4;
  uint64 corpse_query_revision = 5;
  float range_yards = 6;
  bool stop = 7;
}
message ReclaimCorpseRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 death_epoch = 3;
  uint64 expected_position_revision = 4;
  uint64 corpse_guid = 5;
  uint64 expected_corpse_revision = 6;
}
// Only actual server spellbook IDs are returned. Unknown metadata stays unknown.
message DeathActionRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 death_epoch = 3;
}
message KnownSpell {
  uint32 spell_id = 1;
  bool metadata_known = 2;
  string name = 3;
  uint32 family_id = 4;
  uint32 rank = 5;
  uint32 mana_percent = 6;
  float range_yards = 7;
  bool self_only = 8;
  bool automatic_buff_supported = 9;
  string capability = 10;
  string target_rule = 11;
  string blocked_reason = 12;
  uint32 cast_time_ms = 13;
  uint32 flat_cost = 14;
  int32 power_type = 15;
  int32 required_item_class = 16;
  uint32 required_subclass_mask = 17;
  bool requires_stealth = 18;
  bool requires_behind = 19;
  uint32 created_item_entry = 20;
  bool self_cast_supported = 21;
  bool channeled = 22;
}
message SpellOperation {
  uint32 spell_id = 1;
  uint64 target_guid = 2;
  string capability = 3;
  string phase = 4;
  bool transport_written = 5;
  bool server_cast_go = 6;
  bool effect_observed = 7;
  uint32 created_item_entry = 8;
  uint32 created_item_count = 9;
  bool item_push_observed = 10;
  uint64 baseline_inventory_revision = 11;
  uint64 observed_inventory_revision = 12;
  bool inventory_confirmed = 13;
  bool channel_started = 14;
  bool channel_ended = 15;
  uint32 channel_remaining_ms = 16;
}
message ObservedAura {
  uint32 slot = 1;
  uint32 spell_id = 2;
  uint64 caster_guid = 3;
  bool positive = 4;
  bool duration_known = 5;
  uint32 remaining_ms = 6;
  uint64 revision = 7;
  bool negative = 8;
  bool metadata_known = 9;
  uint32 dispel_type = 10;
  repeated uint32 aura_types = 11;
}
message PlayerAuras {
  uint64 target_guid = 1;
  // Only a full SMSG_AURA_UPDATE_ALL establishes a complete baseline.
  bool complete = 2;
  uint64 revision = 3;
  repeated ObservedAura auras = 4;
}
message BuffOperation {
  uint64 sequence = 1;
  uint32 spell_id = 2;
  uint64 target_guid = 3;
  string phase = 4;
  bool transport_written = 5;
  bool server_cast_go = 6;
  bool aura_confirmed = 7;
  uint64 aura_revision = 8;
}
message SpellToolkitState {
  bool spellbook_known = 1;
  uint64 spellbook_revision = 2;
  repeated KnownSpell spells = 3;
  repeated PlayerAuras player_auras = 4;
  BuffOperation last_buff = 5;
  string session_id = 6;
  uint64 self_guid = 7;
  bool targeted_resurrection_supported = 8;
}
message State {
  reserved 2, 14;
  reserved "healing", "healing_lease_remaining_ms";
  bool following = 1;
  bool moving = 3;
  bool known_lesser_heal = 4;
  bool cast_pending = 5;
  string reason = 6;
  // Observation of transport writes is not server movement/healing acceptance.
  uint64 transport_writes = 7;
  uint64 heal_attempts = 8;
  uint64 server_cast_starts = 9;
  uint64 server_cast_go = 10;
  uint32 last_cast_failure = 11;
  uint64 malformed_packets = 12;
  uint64 follow_lease_remaining_ms = 13;
  // Installed client navigation availability and remaining controller limits.
  string limitation = 15;
  // A failed movement-stop write blocks further movement/healing until an
  // explicit stop succeeds or a new authoritative stopped position is seen.
  bool motion_unconfirmed = 16;
  ClientPosition position = 17;
  string interaction_owner = 18;
  uint64 interaction_lease_remaining_ms = 19;
  bool assisting = 20;
  bool known_smite = 21;
  uint64 assist_attempts = 22;
  uint64 assist_lease_remaining_ms = 23;
  uint32 last_cast_spell_id = 24;
  uint64 last_cast_target_guid = 25;
  uint64 server_assist_starts = 26;
  uint64 server_assist_go = 27;
  string assist_reason = 28;
  uint64 smite_damage_events = 29;
  uint64 smite_damage_total = 30;
  bool class_known = 31;
  uint32 class_id = 32;
  string class_name = 33;
  bool known_fireball = 34;
  bool known_sinister_strike = 35;
  bool known_auto_attack = 36;
  uint32 combat_spell_id = 37;
  string combat_style = 38;
  uint64 assist_damage_events = 39;
  uint64 assist_damage_total = 40;
  uint64 fireball_damage_events = 41;
  uint64 fireball_damage_total = 42;
  uint64 sinister_strike_damage_events = 43;
  uint64 sinister_strike_damage_total = 44;
  uint64 melee_damage_events = 45;
  uint64 melee_damage_total = 46;
  // Server ATTACKSTART/ATTACKSTOP observations, distinct from transport intent.
  bool auto_attacking = 47;
  uint64 auto_attack_target_guid = 48;
  bool auto_attack_requested = 49;
  bool auto_attack_unconfirmed = 50;
  uint32 sinister_strike_energy_cost = 51;
  bool mainhand_weapon_verified = 52;
  bool traveling = 53;
  uint64 travel_npc_guid = 54;
  bool nav_available = 55;
  string nav_reason = 56;
  bool practicing = 57;
  string practice_phase = 58;
  uint64 practice_target_guid = 59;
  uint64 practice_lease_remaining_ms = 60;
  uint64 practice_pulls = 61;
  uint64 practice_kills = 62;
  bool known_shadow_bolt = 63;
  uint64 shadow_bolt_damage_events = 64;
  uint64 shadow_bolt_damage_total = 65;
  bool interaction_harvest = 66;
  // Actual online party plus self/fixed owner, refreshed by guarded renewal.
  // Only present while interaction_harvest is true; at most42 unique GUIDs.
  repeated uint64 harvest_guard_guids = 67;
  RecoveryState recovery = 68;
  FargodeepEncounterState fargodeep = 69;
  // Observation RPC acknowledgement, separate from actual movement transport.
  // Retained Nixwick modules decode these legacy finite-controller messages.
  // Do not reuse their tags even though these controllers are absent here.
  reserved 70, 73 to 99;
  bool client_movement_observation_confirmed = 71;
  uint64 client_movement_observation_failures = 72;
  bool buffing = 100;
  uint64 buff_lease_remaining_ms = 101;
  string buff_reason = 102;
  uint64 buff_attempts = 103;
  uint64 buffs_confirmed = 104;
  BuffOperation last_buff = 105;
  string session_id = 106;
  uint64 self_guid = 107;
  SpellOperation last_spell_operation = 108;
  EngageNPCState engage_npc = 109;
  // These are positive observations. Absence does not clear an unseen target.
  repeated ProtectedTarget protected_targets = 110;
  uint64 protected_target_revision = 111;
  bool target_protection_overflow = 112;
  // Kept for compatibility with the separate SpiritHealer release contract.
  reserved 113;
  bool crowd_control_approach_supported = 114;
  CrowdControlState crowd_control = 115;
  MeleeOperation last_melee_operation = 116;
  TargetMovementState target_movement = 117;
  BodyMovementState body_movement = 118;
  MovementOwnerState movement_owner = 119;
  TransportFailure last_transport_failure = 120;
  PolicyDecisionFailure last_follow_policy_failure = 121;
}
// A failed attempted packet write is uncertainty, not a behavior cancellation.
// Sequence identifies the attempted write; it does not confirm server receipt.
message TransportFailure {
  uint64 sequence = 1;
  uint32 opcode = 2;
  string error = 3;
  bool outcome_unknown = 4;
}
message ProtectedTarget {
  uint64 target_guid = 1;
  uint64 caster_guid = 2;
  uint32 spell_id = 3;
  bool duration_known = 4;
  uint32 remaining_ms = 5;
  uint64 revision = 6;
  uint32 slot = 7;
  string capability = 8;
}
message CrowdControlState {
  bool active = 1;
  uint64 target_guid = 2;
  uint32 spell_id = 3;
  string phase = 4;
  uint64 lease_remaining_ms = 5;
}
message PolymorphRequest { string session_id = 1; uint32 spell_id = 2; uint64 target_guid = 3; bool approach = 4; bool cancel = 5; }
message SapRequest { string session_id = 1; uint32 spell_id = 2; uint64 target_guid = 3; bool approach = 4; bool cancel = 5; }
message CreateItemRequest { string session_id = 1; uint64 self_guid = 2; uint32 spell_id = 3; }
message CastSelfRequest { string session_id = 1; uint64 self_guid = 2; uint32 spell_id = 3; }
message CastHealRequest { string session_id = 1; uint64 self_guid = 2; uint64 target_guid = 3; uint32 spell_id = 4; }
message CastOffenseRequest { string session_id = 1; uint64 self_guid = 2; uint64 target_guid = 3; uint32 spell_id = 4; }
message MeleeRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 target_guid = 3;
  bool stop = 4;
  uint64 visit_id = 5;
}
message MeleeOperation {
  uint64 self_guid = 1;
  uint64 target_guid = 2;
  bool enabled = 3;
  string phase = 4;
  bool transport_written = 5;
  uint64 visit_id = 6;
}
message HealingRank {
  uint32 spell_id = 1;
  optional uint32 rank = 2;
  optional uint32 cost = 3;
  double amount = 4;
  optional uint32 cast_ms = 5;
  optional uint32 level = 6;
  optional double min_range = 7;
  optional double max_range = 8;
  bool self_only = 9;
}
message HealingPatient {
  uint64 guid = 1;
  uint32 health = 2;
  uint32 max_health = 3;
  optional double distance = 4;
  bool is_owner = 5;
  bool under_attack = 6;
}
message HealingCaster {
  uint64 guid = 1;
  bool ready = 2;
  optional uint32 mana = 3;
}
message HealingOptionsResponse {
  string session_id = 1;
  HealingCaster caster = 2;
  bool host_owned = 3;
  repeated HealingPatient patients = 4;
  repeated HealingRank spells = 5;
  string reason = 6;
}
message SelfManaCaster {
  uint64 guid = 1;
  bool present = 2;
  bool alive_known = 3;
  bool alive = 4;
  bool map_known = 5;
  bool position_known = 6;
  bool class_known = 7;
  uint32 class_id = 8;
  bool power_known = 9;
  optional uint32 power_type = 10;
  optional uint32 power = 11;
  optional uint32 max_power = 12;
  bool combat_known = 13;
  optional bool in_combat = 14;
  bool movement_known = 15;
  optional bool moving = 16;
  bool channel_known = 17;
  optional uint32 channel_spell_id = 18;
}
message SelfManaActivity {
  bool known = 1;
  optional bool idle = 2;
}
message SelfManaThreat {
  bool known = 1;
  optional bool attacking_self = 2;
  optional bool attacking_party = 3;
}
message SelfManaSpell {
  uint32 spell_id = 1;
  uint32 family_id = 2;
  optional uint32 rank = 3;
  bool metadata_known = 4;
  bool self_cast_supported = 5;
  bool channeled = 6;
  bool ready_known = 7;
  optional bool ready = 8;
}
message SelfManaObservationResponse {
  string session_id = 1;
  uint64 self_guid = 2;
  bool spellbook_known = 3;
  SelfManaCaster caster = 4;
  SelfManaActivity activity = 5;
  SelfManaThreat threat = 6;
  repeated SelfManaSpell spells = 7;
  bool host_owned = 8;
}
message EncounterObservationResponse {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 visit_id = 3;
  optional uint32 map_id = 4;
  // False while native Actions still owns gameplay decisions.
  optional bool host_owned = 5;
  string reason = 6;
  EncounterParty party = 7;
  map<string, EncounterPlayer> players = 8;
  map<string, EncounterCreature> targets = 9;
  map<string, EncounterEngagement> engagement = 10;
  repeated ProtectedTarget protected_auras = 11;
  bool target_protection_overflow = 12;
  map<string, EncounterSpell> spells = 13;
  repeated EncounterControlCapability control_capabilities = 14;
  uint64 observed_owner_focus = 15;
  HealingOptionsResponse healing = 16;
  uint64 world_observation_revision = 17;
  uint64 spellbook_revision = 18;
  bool spellbook_known = 19;
  optional bool host_requested = 20;
  bool melee_known = 21;
  uint64 active_melee_target_guid = 22;
  TargetMovementState target_movement = 23;
  EncounterSupport support = 24;
  NavigationObservation navigation = 25;
  TransportFailure last_transport_failure = 26;
  RecoveryState recovery = 27;
}
message BodyMovementRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 visit_id = 3;
  uint64 sequence_id = 4;
  float bearing_radians = 5;
  // Positive ground input hold time, at most 500ms. An unsupported start settles
  // under normal gravity before a subsequent input can step or jump.
  uint32 duration_ms = 6;
  bool jump = 7;
}
message BodyMovementState {
  uint64 sequence_id = 1;
  uint64 visit_id = 2;
  string phase = 3;
  bool transport_written = 4;
  bool position_estimated = 5;
  float x = 6;
  float y = 7;
  float z = 8;
  string detail = 9;
}
// A finite Lua-selected personal destination. Geometry and movement custody
// remain native; refreshing this goal does not itself write a movement packet.
message FollowFormationRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 visit_id = 3;
  uint64 owner_guid = 4;
  uint64 owner_position_revision = 5;
  float x = 6;
  float y = 7;
  float z = 8;
  float orientation = 9;
  double start_distance = 10;
  double stop_distance = 11;
  bool ready = 12;
  bool hold = 13;
  uint64 follow_revision = 14;
  string phase = 15;
}
message NavigationObservation {
  bool body_movement_supported = 1;
  bool following = 2;
  uint64 owner_guid = 3;
  string phase = 4;
  string detail = 5;
  bool route_available = 6;
  bool motion_unconfirmed = 7;
  bool goal_known = 8;
  float goal_x = 9;
  float goal_y = 10;
  float goal_z = 11;
  BodyMovementState body_movement = 12;
  MovementOwnerState movement_owner = 13;
  bool follow_formation_supported = 14;
  bool owner_arrival = 15;
  // The followed owner is observable even outside the current party.
  EncounterPlayer follow_owner = 16;
  uint64 follow_revision = 17;
  bool ground_navigation_configured = 18;
  PortalFollowObservation portal = 19;
}
message PortalPoint {
  float x = 1;
  float y = 2;
  float z = 3;
}
// A witnessed owner pose inside an entrance, not evidence of an instance or wing.
message PortalFollowObservation {
  uint64 witness_revision = 1;
  uint64 source_visit_id = 2;
  uint64 follow_revision = 3;
  uint64 owner_guid = 4;
  uint32 source_map_id = 5;
  uint32 destination_map_id = 6;
  uint32 trigger_id = 7;
  PortalPoint ground = 8;
  ClientPosition start = 9;
  bool catching_up = 10;
  bool notified = 11;
  bool owner_absent = 12;
  bool sighting_age_known = 13;
  uint64 sighting_age_ms = 14;
  bool disappearance_age_known = 15;
  uint64 disappearance_age_ms = 16;
}
message PortalCatchupRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 visit_id = 3;
  uint64 owner_guid = 4;
  uint64 follow_revision = 5;
  uint64 witness_revision = 6;
  ClientPosition start = 7;
  repeated PortalPoint candidates = 8;
}
message EncounterParty {
  warcraftbuddy.party.v1.Group group = 1;
  warcraftbuddy.party.v1.RaidTargetState raid_targets = 2;
  uint64 revision = 3;
}
message EncounterPlayer {
  uint64 guid = 1;
  bool present = 2;
  bool map_known = 3;
  optional uint32 map_id = 4;
  bool alive_known = 5;
  optional bool alive = 6;
  bool health_known = 7;
  uint32 health = 8;
  uint32 max_health = 9;
  uint32 faction_template = 10;
  bool position_known = 11;
  uint64 position_revision = 12;
  float x = 13;
  float y = 14;
  float z = 15;
  float orientation = 16;
  bool class_known = 17;
  uint32 class_id = 18;
  bool race_known = 19;
  uint32 race_id = 20;
  bool level_known = 21;
  uint32 level = 22;
  bool power_known = 23;
  uint32 power_type = 24;
  uint32 power = 25;
  uint32 max_power = 26;
  bool movement_known = 27;
  bool moving = 28;
  bool combat_known = 29;
  bool in_combat = 30;
  bool combo_known = 31;
  uint64 combo_target_guid = 32;
  uint32 combo_points = 33;
  uint32 player_flags = 34;
}
message EncounterCreature {
  uint64 guid = 1;
  uint32 entry = 2;
  bool present = 3;
  bool map_known = 4;
  optional uint32 map_id = 5;
  bool alive_known = 6;
  optional bool alive = 7;
  bool health_known = 8;
  uint32 health = 9;
  uint32 max_health = 10;
  // Build-12340 unit flags permit an attack. This is not faction hostility.
  bool attackable = 11;
  // Legacy preclassified feed. New clients expose attack_observation instead;
  // Lua owns party membership, freshness and engagement decisions.
  bool engaged = 12 [deprecated = true];
  bool protected = 13;
  bool position_known = 14;
  uint64 position_revision = 15;
  float x = 16;
  float y = 17;
  float z = 18;
  warcraftbuddy.world.v1.CreatureTrajectory trajectory = 19;
  bool unit_flags_known = 20;
  uint32 unit_flags = 21;
  uint32 faction_template = 22;
  // Admission to start autoattack; range/facing determine hits, not attack start.
  bool melee_ready = 23;
  // Currently observed own periodic damage auras, grouped by catalog family.
  repeated uint32 own_damage_families = 24;
  float orientation = 25;
  EncounterAttackObservation attack_observation = 26;
}
// Raw cached ATTACKSTART and selected-target observations. A present empty
// object means no current known attack; absence identifies a legacy backend.
// No freshness, party membership or target priority is inferred here.
message EncounterAttackObservation {
  bool victim_known = 1;
  uint64 victim_guid = 2;
  uint64 age_ms = 3;
  bool target_known = 4;
  uint64 target_guid = 5;
}
message EncounterEngagement {
  uint64 victim_guid = 1;
  uint64 age_ms = 2;
}
message EncounterSpell {
  bool known = 1;
  bool ready = 2;
  string capability = 3;
  bool metadata_known = 4;
  uint32 family_id = 5;
  uint32 rank = 6;
  uint32 level = 7;
  string name = 8;
  uint32 cast_time_ms = 9;
  uint64 cost = 10;
  int32 power_type = 11;
  double min_range = 12;
  double max_range = 13;
  // Catalog base effect estimates, not observed damage or a tactical score.
  double direct_damage = 14;
  repeated EncounterPeriodicDamage periodic_damage = 15;
  uint32 cooldown_ms = 16;
  uint32 category_cooldown_ms = 17;
  uint32 global_cooldown_ms = 18;
  // Exact rank resources, cooldown and requirements; excludes movement/custody.
  bool available = 19;
  bool self_cast_supported = 20;
  bool self_aura_known = 21;
  bool self_aura_active = 22;
  bool weapon_strike = 23;
  bool requires_behind = 24;
  bool requires_stealth = 25;
  bool requires_combo_points = 26;
  uint32 combo_points_generated = 27;
  double weapon_damage_multiplier = 28;
  double weapon_bonus_damage = 29;
  // Base weapon/combo estimate only; excludes AP, armor and combat modifiers.
  bool damage_model_known = 30;
  bool requires_facing = 31;
  uint32 friendly_dispel_mask = 32;
  string target_rule = 33;
  uint32 family_set = 34;
  repeated uint32 family_flags = 35;
  repeated EncounterAuraEffect aura_effects = 36;
}
// Raw catalog effect facts, without class-specific preference or ranking.
message EncounterAuraEffect {
  uint32 kind = 1;
  uint32 a = 2;
  uint32 b = 3;
  uint32 aura = 4;
  int32 misc = 5;
}
message EncounterPeriodicDamage {
  double damage_per_tick = 1;
  uint32 period_ms = 2;
}
// One caller-selected movement step, never a target or rotation controller.
message ApproachTargetRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 target_guid = 3;
  uint64 visit_id = 4;
  float range_yards = 5;
  bool stop = 6;
  bool require_los = 7;
  bool behind = 8;
}
message TargetMovementState {
  uint64 target_guid = 1;
  uint64 visit_id = 2;
  float range_yards = 3;
  bool require_los = 4;
  bool behind = 5;
  string phase = 6;
  bool ready = 7;
}
message EncounterSupport {
  bool caster_in_combat = 1;
  repeated ResurrectionOption resurrections = 2;
  repeated InterruptOption interrupts = 3;
  repeated PlayerAuras player_auras = 4;
  map<uint32, EncounterSpell> aura_spells = 5;
}
message ResurrectionOption {
  uint64 patient_guid = 1;
  uint64 cast_target_guid = 2;
  uint32 spell_id = 3;
  bool ready = 4;
  bool can_approach = 5;
  float range_yards = 6;
}
message InterruptOption {
  uint64 target_guid = 1;
  uint32 spell_id = 2;
  uint32 enemy_spell_id = 3;
  uint64 cast_revision = 4;
  uint32 remaining_ms = 5;
  bool healing = 6;
  bool ready = 7;
  bool can_approach = 8;
  float range_yards = 9;
}
message InterruptCastRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 target_guid = 3;
  uint32 spell_id = 4;
  uint64 cast_revision = 5;
}
message CastBuffRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 target_guid = 3;
  uint32 spell_id = 4;
}
message CastCleanseRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 target_guid = 3;
  uint32 spell_id = 4;
  uint32 aura_slot = 5;
  uint64 aura_revision = 6;
  uint32 aura_spell_id = 7;
}
message EncounterControlCapability {
  uint64 guid = 1;
  string technique = 2;
  bool ready = 3;
}
message ResurrectOnceRequest { string session_id = 1; uint64 self_guid = 2; uint64 target_guid = 3; uint32 spell_id = 4; }
message AcceptResurrectionRequest {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 caster_guid = 3;
  // New policy callers bind the exact observed death and offer. Existing
  // direct callers remain compatible with the original three-field request.
  uint64 death_epoch = 4;
  uint64 expected_offer_revision = 5;
}
message PickLockRequest { string session_id = 1; uint64 target_guid = 2; }

// Last failed shared pure-policy read. Success does not erase this diagnostic.
// Empty source_revision means the callback did not identify its attempted source.
message PolicyDecisionFailure {
  string mode = 1;
  string stage = 2;
  string source_revision = 3;
  string error = 4;
}

service BuddyActions {
  rpc SelectTarget(SelectTargetRequest) returns (SelectTargetResponse);
  rpc ApproachTarget(ApproachTargetRequest) returns (State);
  rpc MoveBody(BodyMovementRequest) returns (State);
  rpc InterruptCast(InterruptCastRequest) returns (State);
  rpc SetFollowFormation(FollowFormationRequest) returns (google.protobuf.Empty);
  rpc SetPortalCatchup(PortalCatchupRequest) returns (google.protobuf.Empty);
  rpc Follow(ToggleRequest) returns (State);
  rpc Assist(ToggleRequest) returns (State);
  rpc EngageNPC(EngageNPCRequest) returns (State);
  rpc HealOnce(google.protobuf.Empty) returns (State);
  rpc Status(google.protobuf.Empty) returns (State);
  rpc Buffs(ToggleRequest) returns (State);
  rpc SpellToolkit(google.protobuf.Empty) returns (SpellToolkitState);
  rpc ReloadBehavior(BehaviorReloadRequest) returns (BehaviorStatus);
  rpc Behavior(google.protobuf.Empty) returns (BehaviorStatus);
  rpc AcquireMovement(MovementOwnerRequest) returns (MovementOwnerLease);
  rpc ReleaseMovement(MovementOwnerRelease) returns (State);
  rpc AcquireInteraction(InteractionRequest) returns (InteractionLease);
  rpc ReleaseInteraction(InteractionRelease) returns (State);
  rpc ApproachLoot(ApproachLootRequest) returns (State);
  rpc ApproachQuest(ApproachQuestRequest) returns (State);
  rpc TravelQuest(ApproachQuestRequest) returns (State);
  rpc TravelTrainer(ApproachQuestRequest) returns (State);
  // Movement only under an owned trade lease to an actual observed vendor.
  rpc TravelVendor(ApproachQuestRequest) returns (State);
  rpc TravelTo(TravelToRequest) returns (State);
  rpc PlanRouteLeg(PlanRouteLegRequest) returns (RouteLeg);
  rpc ExitCrypt(ExitCryptRequest) returns (State);
  rpc Practice(ToggleRequest) returns (State);
  rpc FargodeepEncounter(FargodeepEncounterRequest) returns (State);
  // Normal release, validated same-map ghost route, and corpse reclamation.
  rpc Recovery(ToggleRequest) returns (State);
  rpc ReleaseSpirit(DeathActionRequest) returns (State);
  rpc QueryCorpse(DeathActionRequest) returns (State);
  rpc ApproachCorpse(CorpseApproachRequest) returns (State);
  rpc ReclaimCorpse(ReclaimCorpseRequest) returns (State);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc ResurrectOnce(ResurrectOnceRequest) returns (State);
  rpc AcceptResurrection(AcceptResurrectionRequest) returns (State);
  rpc PickLock(PickLockRequest) returns (State);
  rpc CreateItem(CreateItemRequest) returns (State);
  rpc Polymorph(PolymorphRequest) returns (State);
  rpc Sap(SapRequest) returns (State);
  rpc CastSelf(CastSelfRequest) returns (State);
  rpc HealingOptions(google.protobuf.Empty) returns (HealingOptionsResponse);
  rpc EncounterObservation(google.protobuf.Empty) returns (EncounterObservationResponse);
  rpc CastHeal(CastHealRequest) returns (State);
  rpc CastOffense(CastOffenseRequest) returns (State);
  rpc CastCleanse(CastCleanseRequest) returns (State);
  rpc CastBuff(CastBuffRequest) returns (State);
  rpc Melee(MeleeRequest) returns (State);
  rpc SelfManaObservation(google.protobuf.Empty) returns (SelfManaObservationResponse);
}
