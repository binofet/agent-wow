syntax = "proto3";
package warcraftbuddy.actions.v1;
option go_package = "github.com/agent-wow/agent-wow/modules/buddy-actions/api;actionsv1";
import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

message ToggleRequest { bool enabled = 1; }
// One explicitly coordinated observed Fargodeep encounter; never chooses a target.
message FargodeepEncounterRequest {
  bool enabled = 1;
  uint64 target_guid = 2;
  uint64 engager_guid = 3;
  uint64 expected_quest_log_revision = 4;
  string session_id = 5;
}
message FargodeepEncounterState {
  bool active = 1;
  uint64 target_guid = 2;
  uint64 engager_guid = 3;
  string phase = 4;
  uint64 remaining_ms = 5;
}
// A distinct ordinary leveling window; this grants no quest credit.
message ColdridgeLevelingRequest { string request_id = 1; }
message ColdridgeLevelingState {
  string request_id = 1;
  string goal = 2;
  uint32 target_level = 3;
  uint32 max_pulls = 4;
  // Only the actually reserved first offense supplies corpse authority.
  uint64 source_guid = 5;
  uint64 position_revision = 6;
  bool pull_reserved = 7;
  uint64 remaining_ms = 8;
  uint32 observed_level = 9;
  bool level_five_observed = 10;
  uint64 self_guid = 11;
}
// A separate next-level catch-up window: one explicit observed706, never a quest kill goal.
message ColdridgeCatchupRequest {
  string request_id = 1;
  uint64 target_guid = 2;
  string session_id = 3;
  uint32 expected_start_level = 4;
}
message ColdridgeCatchupState {
  string request_id = 1;
  string goal = 2;
  uint32 start_level = 3;
  uint32 target_level = 4;
  uint32 max_pulls = 5;
  // Source is published only when the first potentially sent offense is reserved.
  uint64 source_guid = 6;
  uint64 position_revision = 7;
  bool pull_reserved = 8;
  uint64 remaining_ms = 9;
  uint32 observed_level = 10;
  bool target_level_observed = 11;
  uint64 self_guid = 12;
  string session_id = 13;
  uint64 target_guid = 14;
}
// One explicitly selected observed road hostile; no quest credit or travel.
message RoadClearRequest {
  string request_id = 1;
  uint64 target_guid = 2;
  string session_id = 3;
  ClientPosition expected_position = 4;
  uint64 position_revision = 5;
}
message RoadClearState {
  string request_id = 1;
  string goal = 2;
  uint64 target_guid = 3;
  // Populated only immediately before the first potentially sent offense.
  uint64 source_guid = 4;
  uint64 self_guid = 5;
  string session_id = 6;
  uint64 position_revision = 7;
  ClientPosition origin = 8;
  uint64 remaining_ms = 9;
  uint32 max_pulls = 10;
  bool pull_reserved = 11;
  bool active = 12;
  string phase = 13;
  uint32 observed_level = 14;
  uint32 selected_entry = 15;
  uint32 selected_level = 16;
  uint32 selected_max_health = 17;
  uint32 selected_faction_template = 18;
  // Actual bound death after own matched cast/damage, not own-killer credit.
  bool source_death_observed = 19;
  uint64 source_death_position_revision = 20;
}
message ClientPosition {
  bool known = 1;
  bool map_known = 2;
  uint32 map_id = 3;
  float x = 4;
  float y = 5;
  float z = 6;
  float orientation = 7;
  // True when these coordinates come from this client's successful movement
  // transport write. This is an estimate, not a server movement acknowledgement.
  bool estimated = 8;
  uint64 age_ms = 9;
  uint64 revision = 10;
}
message InteractionRequest {
  // Fixed coordination labels: loot, quests, trade, training, mail, professions, exploration.
  string owner = 1;
  // Required only to renew an existing lease; never returned by Status.
  string token = 2;
  // 0 means15000; allowed1000..30000ms.
  uint32 lease_ms = 3;
  // Explicit non-destructive gathering/exploration guard; immutable per token.
  // Only professions and exploration may request it. Defense intent stays on.
  bool harvest = 4;
}
message InteractionRelease { string owner = 1; string token = 2; }
message ApproachLootRequest {
  string token = 1;
  // Exactly one observed target: an eligible corpse or own Milly harvest crate.
  uint64 corpse_guid = 2;
  uint64 game_object_guid = 3;
}
message ApproachQuestRequest { string token = 1; uint64 npc_guid = 2; }
// Movement only: a caller destination grants no NPC presence or interaction proof.
message TravelToRequest {
  string token = 1;
  uint32 map_id = 2;
  float x = 3;
  float y = 4;
  float z = 5;
  // 0 preserves the default3yd stop. Explicit0.5..3yd requires the verified
  // route endpoint to fit this radius; it grants no floor/layer tolerance.
  float arrival_distance = 6;
}
// An owned quests lease permits only the fixed, measured crypt exit route.
message ExitCryptRequest { string token = 1; }
message InteractionLease { string token = 1; State state = 2; }
message RecoveryState {
  bool enabled = 1;
  bool active = 2;
  string phase = 3;
  string reason = 4;
  uint64 death_epoch = 5;
  bool release_attempted = 6;
  bool release_written = 7;
  bool ghost_observed = 8;
  bool corpse_query_known = 9;
  bool corpse_found = 10;
  ClientPosition corpse_location = 11;
  uint32 corpse_map_id = 12;
  uint64 corpse_guid = 13;
  ClientPosition graveyard_location = 14;
  bool reclaim_delay_known = 15;
  uint64 reclaim_delay_remaining_ms = 16;
  bool reclaim_attempted = 17;
  bool reclaim_written = 18;
  bool alive_observed = 19;
  bool rested = 20;
  bool movement_unconfirmed = 21;
  uint32 verified_legs = 22;
}
// Passive diagnostics only. These fields grant no cast or retry authority.
message RoadCastObservedEvent {
  uint32 opcode = 1;
  uint32 payload_size = 2;
  bytes payload = 3;
  bool payload_truncated = 4;
  string payload_sha256 = 5;
  string reason = 6;
  uint64 revision = 7;
  uint64 age_ms = 8;
  bool caster_known = 9;
  // First wire identifier may be a cast item or the caster itself.
  uint64 cast_object_guid = 10;
  uint64 caster_guid = 11;
  bool header_known = 12;
  uint32 cast_count = 13;
  uint32 spell_id = 14;
  bool cast_flags_known = 15;
  uint32 cast_flags = 16;
  bool target_flags_known = 17;
  uint32 target_flags = 18;
  bool target_guid_known = 19;
  uint64 target_guid = 20;
  // Supported by the ordinary unit-target parser; not general wire validity.
  bool body_supported = 21;
  bool go_event = 22;
  bool hit_count_known = 23;
  uint32 hit_count = 24;
  bool first_hit_known = 25;
  uint64 first_hit_guid = 26;
  bool miss_count_known = 27;
  uint32 miss_count = 28;
  bool first_miss_known = 29;
  uint64 first_miss_guid = 30;
  uint32 first_miss_reason = 31;
  bool first_miss_reflect_known = 32;
  uint32 first_miss_reflect_result = 33;
}
message RoadCastObserverState {
  bool known = 1;
  bool busy = 2;
  bool poisoned = 3;
  bool initial_seen = 4;
  bool spellbook_known = 5;
  bool outgoing_seen = 6;
  uint32 pending_spell_id = 7;
  uint64 pending_target_guid = 8;
  RoadCastObservedEvent first_rejected = 9;
  bool epoch_known = 10;
  RoadCastObservedEvent first_own_go = 11;
  bool login_836_accepted = 12;
  bool any_write_attempted = 13;
  bool own_start_seen = 14;
  bool own_go_seen = 15;
  uint64 initial_count = 16;
}
message State {
  bool following = 1;
  bool healing = 2;
  bool moving = 3;
  bool known_lesser_heal = 4;
  bool cast_pending = 5;
  string reason = 6;
  // Observation of transport writes is not server movement/healing acceptance.
  uint64 transport_writes = 7;
  uint64 heal_attempts = 8;
  uint64 server_cast_starts = 9;
  uint64 server_cast_go = 10;
  uint32 last_cast_failure = 11;
  uint64 malformed_packets = 12;
  uint64 follow_lease_remaining_ms = 13;
  uint64 healing_lease_remaining_ms = 14;
  // Installed client navigation availability and remaining controller limits.
  string limitation = 15;
  // A failed movement-stop write blocks further movement/healing until an
  // explicit stop succeeds or a new authoritative stopped position is seen.
  bool motion_unconfirmed = 16;
  ClientPosition position = 17;
  string interaction_owner = 18;
  uint64 interaction_lease_remaining_ms = 19;
  bool assisting = 20;
  bool known_smite = 21;
  uint64 assist_attempts = 22;
  uint64 assist_lease_remaining_ms = 23;
  uint32 last_cast_spell_id = 24;
  uint64 last_cast_target_guid = 25;
  uint64 server_assist_starts = 26;
  uint64 server_assist_go = 27;
  string assist_reason = 28;
  uint64 smite_damage_events = 29;
  uint64 smite_damage_total = 30;
  bool class_known = 31;
  uint32 class_id = 32;
  string class_name = 33;
  bool known_fireball = 34;
  bool known_sinister_strike = 35;
  bool known_auto_attack = 36;
  uint32 combat_spell_id = 37;
  string combat_style = 38;
  uint64 assist_damage_events = 39;
  uint64 assist_damage_total = 40;
  uint64 fireball_damage_events = 41;
  uint64 fireball_damage_total = 42;
  uint64 sinister_strike_damage_events = 43;
  uint64 sinister_strike_damage_total = 44;
  uint64 melee_damage_events = 45;
  uint64 melee_damage_total = 46;
  // Server ATTACKSTART/ATTACKSTOP observations, distinct from transport intent.
  bool auto_attacking = 47;
  uint64 auto_attack_target_guid = 48;
  bool auto_attack_requested = 49;
  bool auto_attack_unconfirmed = 50;
  uint32 sinister_strike_energy_cost = 51;
  bool mainhand_weapon_verified = 52;
  bool traveling = 53;
  uint64 travel_npc_guid = 54;
  bool nav_available = 55;
  string nav_reason = 56;
  bool practicing = 57;
  string practice_phase = 58;
  uint64 practice_target_guid = 59;
  uint64 practice_lease_remaining_ms = 60;
  uint64 practice_pulls = 61;
  uint64 practice_kills = 62;
  bool known_shadow_bolt = 63;
  uint64 shadow_bolt_damage_events = 64;
  uint64 shadow_bolt_damage_total = 65;
  bool interaction_harvest = 66;
  // Actual online party plus self/fixed owner, refreshed by guarded renewal.
  // Only present while interaction_harvest is true; at most42 unique GUIDs.
  repeated uint64 harvest_guard_guids = 67;
  RecoveryState recovery = 68;
  FargodeepEncounterState fargodeep = 69;
  ColdridgeLevelingState coldridge_leveling = 70;
  RoadClearState road_clear = 73;
  RoadCastObserverState road_cast_observer = 74;
  ColdridgeCatchupState coldridge_catchup = 75;
}
service BuddyActions {
  rpc Follow(ToggleRequest) returns (State);
  rpc Healing(ToggleRequest) returns (State);
  rpc Assist(ToggleRequest) returns (State);
  rpc HealOnce(google.protobuf.Empty) returns (State);
  rpc Status(google.protobuf.Empty) returns (State);
  rpc AcquireInteraction(InteractionRequest) returns (InteractionLease);
  rpc ReleaseInteraction(InteractionRelease) returns (State);
  rpc ApproachLoot(ApproachLootRequest) returns (State);
  rpc ApproachQuest(ApproachQuestRequest) returns (State);
  rpc TravelQuest(ApproachQuestRequest) returns (State);
  rpc TravelTrainer(ApproachQuestRequest) returns (State);
  // Movement only under an owned trade lease to an actual observed vendor.
  rpc TravelVendor(ApproachQuestRequest) returns (State);
  rpc TravelTo(TravelToRequest) returns (State);
  rpc ExitCrypt(ExitCryptRequest) returns (State);
  rpc Practice(ToggleRequest) returns (State);
  rpc FargodeepEncounter(FargodeepEncounterRequest) returns (State);
  rpc StartColdridgeLeveling(ColdridgeLevelingRequest) returns (State);
  rpc StartColdridgeCatchup(ColdridgeCatchupRequest) returns (State);
  rpc StartRoadClear(RoadClearRequest) returns (State);
  // Normal release, validated same-map ghost route, and corpse reclamation.
  rpc Recovery(ToggleRequest) returns (State);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
