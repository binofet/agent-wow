services:
  module:
    build:
      context: ../..
      dockerfile: modules/buddy-actions/Dockerfile
    network_mode: none
    read_only: true
    environment:
      BUDDY_INDEPENDENT: ${BUDDY_INDEPENDENT:-false}
      BUDDY_NAV_DATA_DIR: /var/lib/buddy-nav
    volumes:
      - ${BUDDY_NAV_DATA_DIR_HOST:-../../data/navigation}:/var/lib/buddy-nav:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
