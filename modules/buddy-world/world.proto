syntax = "proto3";

package warcraftbuddy.world.v1;
option go_package = "github.com/agent-wow/agent-wow/modules/buddy-world/api;worldv1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

// Read-only observations for the session character and fixed owner player 3.
// Ages measure time since an actual observation, not a claim that an unchanged
// stationary player disappeared. Positions are never predicted by this module.
message PlayerState {
  uint64 guid = 1;
  bool present = 2;
  bool map_known = 3;
  uint32 map_id = 4;
  bool position_known = 5;
  float x = 6;
  float y = 7;
  float z = 8;
  float orientation = 9;
  uint64 position_age_ms = 10;
  uint64 position_revision = 11;
  bool movement_flags_known = 12;
  uint32 movement_flags = 13;
  uint32 extra_movement_flags = 14;
  // Timestamp from this player's movement packet; not our session clock.
  uint32 movement_time = 15;
  bool health_known = 16;
  uint32 health = 17;
  uint32 max_health = 18;
  bool power_known = 19;
  uint32 power = 20;
  uint32 max_power = 21;
  uint32 power_type = 22;
  bool unit_flags_known = 23;
  uint32 unit_flags = 24;
  bool alive_known = 25;
  bool alive = 26;
  uint64 vitals_age_ms = 27;
  bool speeds_known = 28;
  float walk_speed = 29;
  float run_speed = 30;
  uint64 observation_age_ms = 31;
  uint32 player_flags = 32;
  uint32 dynamic_flags = 33;
  bool target_known = 34;
  uint64 target_guid = 35;
  uint32 faction_template = 36;
  uint32 unit_flags_2 = 37;
  bool class_known = 38;
  uint32 class_id = 39;
  bool level_known = 40;
  uint32 level = 41;
  bool base_mana_known = 42;
  uint32 base_mana = 43;
  bool combat_reach_known = 44;
  float combat_reach = 45;
  bool base_attack_time_known = 46;
  uint32 base_attack_time_ms = 47;
  EquippedWeapon mainhand = 48;
}

message EquippedWeapon {
  bool slot_known = 1;
  uint64 item_guid = 2;
  bool metadata_known = 3;
  uint32 entry = 4;
  bool durability_known = 5;
  uint32 durability = 6;
  uint32 max_durability = 7;
}

message SnapshotRequest {}

message GameObjectState {
  uint64 guid = 1;
  uint32 entry = 2;
  bool present = 3;
  bool map_known = 4;
  uint32 map_id = 5;
  bool position_known = 6;
  float x = 7;
  float y = 8;
  float z = 9;
  float orientation = 10;
  uint64 position_revision = 11;
  uint64 position_age_ms = 12;
  uint64 observation_age_ms = 13;
  bool type_known = 14;
  uint32 game_object_type = 15;
  bool flags_known = 16;
  uint32 flags = 17;
  bool dynamic_flags_known = 18;
  uint32 dynamic_flags = 19;
}

// Public, server-observed creature state. No database lookup or invented name.
message CreatureState {
  uint64 guid = 1;
  uint32 entry = 2;
  uint32 npc_flags = 3;
  bool present = 4;
  bool map_known = 5;
  uint32 map_id = 6;
  bool position_known = 7;
  float x = 8;
  float y = 9;
  float z = 10;
  float orientation = 11;
  uint64 position_age_ms = 12;
  uint64 position_revision = 13;
  uint64 observation_age_ms = 14;
  bool health_known = 15;
  uint32 health = 16;
  uint32 max_health = 17;
  bool alive_known = 18;
  bool alive = 19;
  uint32 unit_flags = 20;
  uint32 dynamic_flags = 21;
  // These distances use the last SERVER position, never predicted motion.
  // Consumers must use the companion controller's estimate for current range.
  bool distance_to_self_observed_known = 22;
  float distance_to_self_observed = 23;
  bool distance_to_owner_observed_known = 24;
  float distance_to_owner_observed = 25;
  uint32 movement_flags = 26;
  uint32 faction_template = 27;
  bool target_known = 28;
  uint64 target_guid = 29;
  uint32 unit_flags_2 = 30;
  // Distinct from UNIT_FIELD_TARGET selection: actual ATTACKSTART evidence.
  bool attack_victim_known = 31;
  uint64 attack_victim_guid = 32;
  uint64 attack_age_ms = 33;
  CreatureTrajectory trajectory = 34;
  bool combat_reach_known = 35;
  float combat_reach = 36;
  bool level_known = 37;
  uint32 level = 38;
}

// Advertised server trajectory, separate from actual position observations.
// A consumer may derive an explicitly estimated endpoint after age>=duration
// for noncyclic, nontransport paths. This does not refresh position_age_ms.
message CreatureTrajectory {
  bool known = 1;
  uint32 duration_ms = 2;
  uint64 age_ms = 3;
  bool destination_known = 4;
  float destination_x = 5;
  float destination_y = 6;
  float destination_z = 7;
  bool cyclic = 8;
  bool transport_relative = 9;
  uint64 transport_guid = 10;
  int32 transport_seat = 11;
  bool stopped = 12;
  uint32 flags = 13;
}

message QuestLogEntry {
  // Zero-based server quest-log slot; 0 quest_id means empty.
  uint32 slot = 1;
  uint32 quest_id = 2;
  uint32 state = 3;
  bool complete = 4;
  bool failed = 5;
  // Four uint16 counters from the two server quest-objective fields.
  repeated uint32 objective_counts = 6;
  uint32 expire_time = 7;
}

message BackpackSlot {
  // Logical backpack bag0, slots0..15; equipment and equipped bags excluded.
  uint32 bag = 1;
  uint32 slot = 2;
  uint64 item_guid = 3;
  uint32 entry = 4;
  uint32 stack_count = 5;
  // Requires an owned ITEM/CONTAINER observation matching the current GUID.
  bool metadata_known = 6;
}

message SnapshotResponse {
  PlayerState self = 1;
  PlayerState owner = 2;
  uint64 ignored_packets = 3;
  uint64 malformed_packets = 4;
  uint32 last_opcode = 5;
  // Fixed diagnostic strings only; no packet payloads or player text.
  string last_parse_error = 6;
  uint64 observed_packets = 7;
  // At most64 present questgivers, nearest observed owner first (self fallback).
  repeated CreatureState quest_givers = 8;
  bool self_quest_log_known = 9;
  uint64 self_quest_log_revision = 10;
  // Exactly25 slots when known; only the current character's quest log.
  repeated QuestLogEntry self_quest_log = 11;
  // At most64 dead creatures flagged LOOTABLE for this receiving character.
  repeated CreatureState lootable_corpses = 12;
  bool backpack_known = 13;
  uint64 backpack_revision = 14;
  // Exactly16 slots when known; empty slots have item_guid0.
  repeated BackpackSlot backpack = 15;
  // Only the currently observed owner's target, if present in the NPC cache.
  CreatureState owner_target = 16;
  // At most32 present creatures ordered by observed self distance.
  repeated CreatureState nearby_creatures = 17;
  bool self_copper_known = 18;
  uint32 self_copper = 19;
  // Advances only when the own coinage value/known baseline changes.
  uint64 self_copper_revision = 20;
  // At most32 actual, present GAMEOBJECTs whose public type byte is MAILBOX19.
  repeated GameObjectState mailboxes = 21;
  // At most32 present Milly's Harvest entry161557/type3 quest chests.
  repeated GameObjectState quest_objects = 22;
}

service BuddyWorld {
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
}
