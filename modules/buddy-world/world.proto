syntax = "proto3";

package warcraftbuddy.world.v1;
option go_package = "github.com/agent-wow/agent-wow/modules/buddy-world/api;worldv1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

// Read-only observations for the session character and fixed owner player 3.
// Ages measure time since an actual observation, not a claim that an unchanged
// stationary player disappeared. An inferred own spline endpoint is explicitly
// marked; retained raw movement facts below are never refreshed by estimates.
message PlayerState {
  uint64 guid = 1;
  bool present = 2;
  bool map_known = 3;
  uint32 map_id = 4;
  bool position_known = 5;
  float x = 6;
  float y = 7;
  float z = 8;
  float orientation = 9;
  uint64 position_age_ms = 10;
  uint64 position_revision = 11;
  bool movement_flags_known = 12;
  uint32 movement_flags = 13;
  uint32 extra_movement_flags = 14;
  // Timestamp from this player's movement packet; not our session clock.
  uint32 movement_time = 15;
  bool health_known = 16;
  uint32 health = 17;
  uint32 max_health = 18;
  bool power_known = 19;
  uint32 power = 20;
  uint32 max_power = 21;
  uint32 power_type = 22;
  bool unit_flags_known = 23;
  uint32 unit_flags = 24;
  bool alive_known = 25;
  bool alive = 26;
  uint64 vitals_age_ms = 27;
  bool speeds_known = 28;
  float walk_speed = 29;
  float run_speed = 30;
  uint64 observation_age_ms = 31;
  uint32 player_flags = 32;
  uint32 dynamic_flags = 33;
  bool target_known = 34;
  uint64 target_guid = 35;
  uint32 faction_template = 36;
  uint32 unit_flags_2 = 37;
  bool class_known = 38;
  uint32 class_id = 39;
  bool level_known = 40;
  uint32 level = 41;
  bool base_mana_known = 42;
  uint32 base_mana = 43;
  bool combat_reach_known = 44;
  float combat_reach = 45;
  bool base_attack_time_known = 46;
  uint32 base_attack_time_ms = 47;
  EquippedWeapon mainhand = 48;
  bool channel_object_known = 49;
  uint64 channel_object_guid = 50;
  bool channel_spell_known = 51;
  uint32 channel_spell_id = 52;
  bool shapeshift_form_known = 53;
  uint32 shapeshift_form = 54;
  // Private own equipment slot16, including an explicitly known empty slot.
  EquippedWeapon offhand = 55;
  uint64 offhand_revision = 56;
  // Observed public UNIT_FIELD_BYTES_0 race byte, not an inferred race.
  bool race_known = 57;
  uint32 race_id = 58;
  bool aura_state_known = 59;
  uint32 aura_state = 60;
  // Legacy own endpoint settlement after control return and spline duration.
  // This pose is inferred, not a newly received server arrival observation.
  bool position_inferred = 61;
}

// Conditional MovementInfo transport tail, including a signed seat and the
// separately present interpolation time. A zero transport GUID is still data.
message MovementTransportFacts {
  uint64 guid = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float orientation = 5;
  uint32 time = 6;
  sint32 seat = 7;
  bool time2_known = 8;
  uint32 time2 = 9;
}

message MovementJumpFacts {
  float velocity = 1;
  float sin_angle = 2;
  float cos_angle = 3;
  float xy_speed = 4;
}

// Complete observed 3.3.5a MovementInfo. Message presence distinguishes the
// conditional transport and jump tails; zero values do not mean unknown.
message MovementInfoFacts {
  uint32 flags = 1;
  uint32 extra_flags = 2;
  uint32 time = 3;
  float x = 4;
  float y = 5;
  float z = 6;
  float orientation = 7;
  MovementTransportFacts transport = 8;
  bool pitch_known = 9;
  float pitch = 10;
  uint32 fall_time = 11;
  MovementJumpFacts jump = 12;
  bool spline_elevation_known = 13;
  float spline_elevation = 14;
}

// Latest complete own MovementInfo received in the current World visit. This
// historical observation is not an instruction, acknowledgement or arrival.
// Snapshot reads, client writes and inferred endpoint settlement never refresh
// its age/revision or rewrite its flags. Invalid optional floats leave known
// false and omit info/wire_image without rejecting otherwise valid old poses.
message OwnMovementFacts {
  bool known = 1;
  uint64 self_guid = 2;
  uint64 visit_revision = 3;
  uint64 revision = 4;
  uint32 source_opcode = 5;
  uint64 age_ms = 6;
  bool map_known = 7;
  uint32 map_id = 8;
  MovementInfoFacts info = 9;
  // Exact detached received MovementInfo prefix, with no leading mover GUID.
  // This is evidence only; it grants no transport-write authority.
  bytes wire_image = 10;
  // Correlation captured with this actual packet, never refreshed by Snapshot.
  agentwow.module.v1.TransportScope transport_scope = 11;
}

// Latest own server spline header in the current visit. This is historical
// evidence, not a claim the spline remains active. ID is opaque: zero is valid,
// and neither ID nor duration establishes flight acceptance or arrival.
message OwnSplineFacts {
  bool known = 1;
  uint64 self_guid = 2;
  uint64 visit_revision = 3;
  uint64 revision = 4;
  uint32 source_opcode = 5;
  uint64 age_ms = 6;
  bool id_known = 7;
  uint32 spline_id = 8;
  uint32 flags = 9;
  uint32 duration_ms = 10;
  uint32 elapsed_ms = 11;
  bool destination_known = 12;
  float destination_x = 13;
  float destination_y = 14;
  float destination_z = 15;
  bool transport_relative = 16;
  uint64 transport_guid = 17;
  sint32 transport_seat = 18;
  bool stopped = 19;
  bool cyclic = 20;
  bool map_known = 21;
  uint32 map_id = 22;
}

// Current parser/transport agreement, separate from retained historical facts
// and legacy endpoint inference. A duration only determines ACK cadence.
message OwnMotionAuthority {
  bool known = 1;
  uint64 self_guid = 2;
  uint64 visit_revision = 3;
  uint64 revision = 4;
  uint64 movement_revision = 5;
  uint64 spline_revision = 6;
  agentwow.module.v1.TransportScope transport_scope = 7;
  string reason = 8;
  uint64 duration_remaining_ms = 9;
  // Actual own UNIT_FIELD_FLAGS observations, not flags inferred from a timer.
  bool unit_flags_known = 10;
  uint32 unit_flags = 11;
  uint64 unit_flags_revision = 12;
  uint64 unit_flags_age_ms = 13;
  uint32 unit_flags_source_opcode = 14;
  uint64 unit_flags_motion_revision = 15;
}

message CompleteSplineRequest {
  uint64 self_guid = 1;
  uint64 visit_revision = 2;
  uint64 authority_revision = 3;
  uint64 movement_revision = 4;
  uint64 spline_revision = 5;
  uint64 expected_revision = 6;
  agentwow.module.v1.TransportScope transport_scope = 7;
}

// One scoped protocol write. The constructed movement image is explicitly
// inferred from received movement plus an advertised endpoint, never an actual
// endpoint observation. Neither a successful write nor duration proves arrival.
message SplineCompletionOperation {
  uint64 revision = 1;
  uint64 self_guid = 2;
  uint64 visit_revision = 3;
  uint64 authority_revision = 4;
  uint64 movement_revision = 5;
  uint64 spline_revision = 6;
  agentwow.module.v1.TransportScope transport_scope = 7;
  bool pending = 8;
  bool transport_written = 9;
  bool transport_unknown = 10;
  string phase = 11;
  string error = 12;
  bool movement_image_inferred = 13;
  bool arrival_known = 14;
  uint32 spline_id = 15;
  bool spline_id_known = 16;
  string movement_image_source = 17;
  // Retirement records new actual ground state, not ACK delivery or arrival.
  bool retired = 18;
  uint64 retirement_revision = 19;
  uint64 retired_movement_revision = 20;
  uint64 retired_unit_flags_revision = 21;
  agentwow.module.v1.TransportScope retirement_scope = 22;
}

message RetireSplineCompletionRequest {
  uint64 self_guid = 1;
  uint64 visit_revision = 2;
  uint64 expected_revision = 3;
  uint64 authority_revision = 4;
  uint64 movement_revision = 5;
  uint64 unit_flags_revision = 6;
  agentwow.module.v1.TransportScope transport_scope = 7;
}

message SplineCompletionObservation {
  uint64 self_guid = 1;
  uint64 visit_revision = 2;
  uint64 revision = 3;
  SplineCompletionOperation operation = 4;
  // Current continuity of the retired ground evidence, not a stored arrival.
  bool retirement_current = 5;
  // Current mechanical evidence admission, including sticky invalidation.
  bool retirement_available = 6;
  // Retained mechanical supersession receipt; old delivery uncertainty remains.
  SplineTransferAdoption transfer_adoption = 7;
  // Live unused handoff admission, separate from its historical receipt.
  bool transfer_adoption_current = 8;
}

// Independently paired Core/World visit domains and current flight evidence.
// ContinuationKnown describes a candidate observed continuation only; it does
// not adopt a booking, release a pending report, or establish arrival.
message WorldTransferObservation {
  uint64 revision = 1;
  bool known = 2;
  string reason = 3;
  uint64 self_guid = 4;
  uint64 from_visit_revision = 5;
  uint64 to_visit_revision = 6;
  agentwow.module.v1.ObservedWorldTransfer core = 7;
  SplineCompletionOperation predecessor_completion = 8;
  OwnMotionAuthority predecessor_authority = 9;
  bool predecessor_qualified = 10;
  bool continuation_known = 11;
  agentwow.module.v1.TransportScope current_scope = 12;
  uint64 current_authority_revision = 13;
  uint64 current_movement_revision = 14;
  uint64 current_spline_revision = 15;
  uint64 current_unit_flags_revision = 16;
  uint64 current_unit_flags_motion_revision = 17;
  bool current_unit_flags_known = 18;
  uint32 current_unit_flags = 19;
  bool arrival_known = 20;
  bool booking_causality_known = 21;
}

// Explicitly replace one completion slot with its observed adjacent segment.
// No packet is sent, and neither booking acceptance nor arrival is inferred.
message AdoptSplineTransferRequest {
  uint64 self_guid = 1;
  uint64 visit_revision = 2;
  uint64 expected_revision = 3;
  uint64 transfer_revision = 4;
  uint64 core_transfer_revision = 5;
  uint64 authority_revision = 6;
  uint64 movement_revision = 7;
  uint64 spline_revision = 8;
  uint64 unit_flags_revision = 9;
  agentwow.module.v1.TransportScope transport_scope = 10;
}

// Detached witness and original predecessor receipt, including UNKNOWN. This
// authorizes a distinct observed segment, never replay of the predecessor.
message SplineTransferAdoption {
  uint64 revision = 1;
  uint64 self_guid = 2;
  uint64 from_visit_revision = 3;
  uint64 to_visit_revision = 4;
  WorldTransferObservation transfer = 5;
}

// Raw observed build-12340 item fields, not resolved enchant/gem bonuses.
// Enchantment slots include permanent/temporary/socket/other native slots;
// an ID is an enchantment reference, not necessarily a gem item entry.
message ItemEnchantmentSlot {
  uint32 slot = 1; uint32 id = 2; uint32 duration_raw = 3; uint32 charges = 4;
}
message ItemEnhancementState {
  // Bit n covers native slot n (0..11) for this field. A set bit plus
  // omitted sparse slot/value means KNOWN ZERO; an unset bit means UNKNOWN.
  // Sparse rows contain only nonzero observed values; never infer coverage
  // from their presence. Raw enchantment IDs are not gem item entries.
  uint32 id_known_mask = 1; uint32 duration_known_mask = 2; uint32 charges_known_mask = 3;
  repeated ItemEnchantmentSlot enchantments = 4;
  bool property_seed_known = 5; uint32 property_seed = 6;
  bool random_property_id_known = 7; sint32 random_property_id = 8;
}

// Private own equipment slots0..18; bags and bank slots are excluded.
message EquipmentSlotState {
  uint32 slot = 1;
  bool slot_known = 2;
  uint64 item_guid = 3;
  bool metadata_known = 4;
  uint32 entry = 5;
  uint32 stack_count = 6;
  bool durability_known = 7;
  uint32 durability = 8;
  uint32 max_durability = 9;
  bool enhancements_known = 10;
  bool has_enhancements = 11;
  ItemEnhancementState enhancement_details = 12;
}

// Actual observed own non-bones CORPSE object, not a guessed death location.
message CorpseState {
  uint64 guid = 1;
  uint64 owner_guid = 2;
  bool present = 3;
  bool map_known = 4;
  uint32 map_id = 5;
  bool position_known = 6;
  float x = 7;
  float y = 8;
  float z = 9;
  float orientation = 10;
  uint64 position_revision = 11;
  uint64 position_age_ms = 12;
  uint64 observation_age_ms = 13;
  bool flags_known = 14;
  uint32 flags = 15;
  bool dynamic_flags_known = 16;
  uint32 dynamic_flags = 17;
  bool race_known = 18;
  uint32 race_id = 19;
}

message EquippedWeapon {
  bool slot_known = 1;
  uint64 item_guid = 2;
  bool metadata_known = 3;
  uint32 entry = 4;
  bool durability_known = 5;
  uint32 durability = 6;
  uint32 max_durability = 7;
}

message SnapshotRequest {
  // Optional exact lookup in the existing creature cache; zero requests none.
  // This never changes the cache, discovery ranking or observed positions.
  uint64 creature_guid = 1;
  // Optional exact-entry filters in existing bounded caches; zero requests none.
  uint32 creature_entry = 2;
  uint32 game_object_entry = 3;
  // Optional bounded discovery from actual cached same-map type3 objects.
  // Raw server distance only orders candidates; the current client position
  // and public template proof remain required before approach or gathering.
  bool include_gathering_objects = 4;
  // Retain the existing Nixwick client lookup contract during consolidation.
  // Both nonzero filters must match actual observed fields.
  uint32 creature_faction_template = 5;
}

// A successful client movement write, supplied by the movement controller.
// This is discovery guidance, not server acceptance or an observed player pose.
message ClientMovementRequest {
  uint64 self_guid = 1;
  uint32 map_id = 2;
  uint64 server_position_revision = 3;
  uint64 sequence = 4;
  // false invalidates a preceding estimate after an ambiguous movement write.
  bool valid = 5;
  float x = 6;
  float y = 7;
  float z = 8;
  float orientation = 9;
}

message DiscoveryAnchor {
  uint64 self_guid = 1;
  uint32 map_id = 2;
  uint64 server_position_revision = 3;
  uint64 sequence = 4;
  float x = 5;
  float y = 6;
  float z = 7;
  float orientation = 8;
  bool estimated = 9;
  uint64 age_ms = 10;
}

// A visible area-spell DYNAMICOBJECT. Coordinates and radius come from its
// own update fields; its spell or faction is not classified here.
message SpellGroundEffect {
  uint64 guid = 1;
  uint64 caster_guid = 2;
  uint32 spell_id = 3;
  float radius_yards = 4;
  float x = 5;
  float y = 6;
  float z = 7;
  // First CREATE received in this continuous visibility interval.
  uint64 first_observed_at_unix_ms = 8;
  // Wrapping realm clock, not Unix time or a remaining duration.
  optional uint32 server_cast_time_ms = 9;
  uint64 position_revision = 10;
}

message GameObjectState {
  uint64 guid = 1;
  uint32 entry = 2;
  bool present = 3;
  bool map_known = 4;
  uint32 map_id = 5;
  bool position_known = 6;
  float x = 7;
  float y = 8;
  float z = 9;
  float orientation = 10;
  uint64 position_revision = 11;
  uint64 position_age_ms = 12;
  uint64 observation_age_ms = 13;
  bool type_known = 14;
  uint32 game_object_type = 15;
  bool flags_known = 16;
  uint32 flags = 17;
  bool dynamic_flags_known = 18;
  uint32 dynamic_flags = 19;
  bool created_by_known = 20;
  uint64 created_by_guid = 21;
  bool state_known = 22;
  uint32 state = 23;
  // Public UNIT_FIELD_TARGET of the visible creator of this summoning object.
  optional uint64 creator_selected_target_guid = 24;
}

// Public, server-observed creature state. No database lookup or invented name.
message CreatureState {
  uint64 guid = 1;
  uint32 entry = 2;
  uint32 npc_flags = 3;
  bool present = 4;
  bool map_known = 5;
  uint32 map_id = 6;
  bool position_known = 7;
  float x = 8;
  float y = 9;
  float z = 10;
  float orientation = 11;
  uint64 position_age_ms = 12;
  uint64 position_revision = 13;
  uint64 observation_age_ms = 14;
  bool health_known = 15;
  uint32 health = 16;
  uint32 max_health = 17;
  bool alive_known = 18;
  bool alive = 19;
  uint32 unit_flags = 20;
  uint32 dynamic_flags = 21;
  // These distances use the last SERVER position, never predicted motion.
  // Consumers must use the companion controller's estimate for current range.
  bool distance_to_self_observed_known = 22;
  float distance_to_self_observed = 23;
  bool distance_to_owner_observed_known = 24;
  float distance_to_owner_observed = 25;
  uint32 movement_flags = 26;
  uint32 faction_template = 27;
  bool target_known = 28;
  uint64 target_guid = 29;
  uint32 unit_flags_2 = 30;
  // Distinct from target selection: actual ATTACKSTART or positive incoming
  // NPC damage evidence. Damage refreshes this age only from a complete frame.
  bool attack_victim_known = 31;
  uint64 attack_victim_guid = 32;
  uint64 attack_age_ms = 33;
  CreatureTrajectory trajectory = 34;
  bool combat_reach_known = 35;
  float combat_reach = 36;
  bool level_known = 37;
  uint32 level = 38;
  bool unit_flags_known = 39;
  bool dynamic_flags_known = 40;
  CreatureCast active_cast = 41;
  // Latest received pose explicitly reported a stationary world-space creature.
  bool stationary_position_known = 42;
}

// A cast observed in a normal server spell-start event. An expired cast or
// a cast with a matching terminal event is omitted from the snapshot.
message CreatureCast {
  uint32 spell_id = 1;
  uint32 cast_count = 2;
  uint32 remaining_ms = 3;
  uint64 target_guid = 4;
  // Separates successive creature casts that reuse cast count zero.
  uint64 revision = 5;
}

// Advertised server trajectory, separate from actual position observations.
// A consumer may derive an explicitly estimated endpoint after age>=duration
// for noncyclic, nontransport paths. This does not refresh position_age_ms.
message CreatureTrajectory {
  bool known = 1;
  uint32 duration_ms = 2;
  uint64 age_ms = 3;
  bool destination_known = 4;
  float destination_x = 5;
  float destination_y = 6;
  float destination_z = 7;
  bool cyclic = 8;
  bool transport_relative = 9;
  uint64 transport_guid = 10;
  int32 transport_seat = 11;
  bool stopped = 12;
  uint32 flags = 13;
}

message QuestLogEntry {
  // Zero-based server quest-log slot; 0 quest_id means empty.
  uint32 slot = 1;
  uint32 quest_id = 2;
  uint32 state = 3;
  bool complete = 4;
  bool failed = 5;
  // Four uint16 counters from the two server quest-objective fields.
  repeated uint32 objective_counts = 6;
  uint32 expire_time = 7;
}

message BackpackSlot {
  // Logical carried bag0..4 and zero-based slot; bag0 is the built-in backpack.
  uint32 bag = 1;
  uint32 slot = 2;
  uint64 item_guid = 3;
  uint32 entry = 4;
  uint32 stack_count = 5;
  // Requires an owned ITEM/CONTAINER observation matching the current GUID.
  bool metadata_known = 6;
  bool durability_known = 7;
  uint32 durability = 8;
  uint32 max_durability = 9;
  bool enhancements_known = 10;
  bool has_enhancements = 11;
  ItemEnhancementState enhancement_details = 12;
}

// Only private own carried inventory: built-in backpack plus four equipped bags.
// Unknown occupied bag contents are never represented as known empty slots.
message InventoryBag {
  uint32 bag = 1;
  bool slot_known = 2;
  uint64 container_guid = 3;
  bool metadata_known = 4;
  uint32 entry = 5;
  bool contents_known = 6;
  uint32 slot_count = 7;
  repeated BackpackSlot slots = 8;
}

// Actual private own-player skill fields; no inferred profession membership.
message SkillState {
  uint32 slot = 1;
  uint32 skill_id = 2;
  uint32 step = 3;
  uint32 value = 4;
  uint32 max_value = 5;
  int32 temporary_bonus = 6;
  int32 permanent_bonus = 7;
}

message SnapshotResponse {
  PlayerState self = 1;
  PlayerState owner = 2;
  uint64 ignored_packets = 3;
  uint64 malformed_packets = 4;
  uint32 last_opcode = 5;
  // Fixed diagnostic strings only; no packet payloads or player text.
  string last_parse_error = 6;
  uint64 observed_packets = 7;
  // At most64 present questgivers, nearest observed owner first (self fallback).
  repeated CreatureState quest_givers = 8;
  bool self_quest_log_known = 9;
  uint64 self_quest_log_revision = 10;
  // Exactly25 slots when known; only the current character's quest log.
  repeated QuestLogEntry self_quest_log = 11;
  // At most64 dead creatures flagged LOOTABLE for this receiving character.
  repeated CreatureState lootable_corpses = 12;
  bool backpack_known = 13;
  uint64 backpack_revision = 14;
  // Exactly16 slots when known; empty slots have item_guid0.
  repeated BackpackSlot backpack = 15;
  // Only the currently observed owner's target, if present in the NPC cache.
  CreatureState owner_target = 16;
  // At most32 present creatures, prioritizing actual player attackers and then
  // discovery distance. The optional client-written anchor never changes poses.
  repeated CreatureState nearby_creatures = 17;
  bool self_copper_known = 18;
  uint32 self_copper = 19;
  // Advances only when the own coinage value/known baseline changes.
  uint64 self_copper_revision = 20;
  // At most32 actual, present GAMEOBJECTs whose public type byte is MAILBOX19.
  repeated GameObjectState mailboxes = 21;
  // At most32 present Milly's Harvest entry161557/type3 quest chests.
  repeated GameObjectState quest_objects = 22;
  // The requested creature, if still present in the bounded observation cache.
  // Independent of nearby_creatures truncation; retains actual observation ages.
  CreatureState requested_creature = 23;
  bool self_skills_known = 24;
  uint64 self_skills_revision = 25;
  // Exactly128 wire slots when known; skill_id0 means empty.
  repeated SkillState self_skills = 26;
  bool self_free_primary_slots_known = 27;
  uint32 self_free_primary_slots = 28;
  uint64 self_free_primary_slots_revision = 29;
  // At most32 present public SPELL_FOCUS(type8) objects. FocusID is template
  // metadata and must be obtained through an ordinary gameobject query.
  repeated GameObjectState spell_focuses = 30;
  // At most4 present type17/entry35591 bobbers with actual createdBy=self.
  repeated GameObjectState own_fishing_bobbers = 31;
  // At most32 present exact-entry matches, retaining actual positions and ages.
  repeated CreatureState requested_creatures = 32;
  repeated GameObjectState requested_game_objects = 33;
  // True only with coherent private own slot references and all equipped bag
  // layouts/contents observed. Nonempty item metadata is separately qualified.
  bool inventory_known = 34;
  uint64 inventory_revision = 35;
  // Exactly5 logical bags0..4 after own CREATE; total at most160 content slots.
  repeated InventoryBag inventory_bags = 36;
  // At most32 present cached creatures with observed zero health, SKINNABLE
  // unit flag and known cleared LOOTABLE dynamic flag. This is recipient-visible
  // eligibility evidence, not a claim about unobserved loot contents or range.
  repeated CreatureState skinnable_corpses = 37;
  // At most64 other actual present PLAYER CREATE observations, excluding self
  // and the fixed owner. Public pose/vitals/flags/class/level only: no private
  // equipment, inventory, skills or quest state. No party membership is inferred.
  repeated PlayerState nearby_players = 38;
  repeated GameObjectState nearby_gathering_objects = 39;
  // At most64 actual present cached NPCs with observed TRAINER(0x10),
  // independent of nearby_creatures truncation. Ordered by observed self
  // distance; no trainer type, range, availability or interaction is inferred.
  repeated CreatureState trainer_creatures = 40;
  // Coherent private own equipment GUID references. Nonempty item metadata
  // is qualified separately and requires an actual owned current-epoch ITEM.
  bool self_equipment_known = 41;
  uint64 self_equipment_revision = 42;
  // Exactly19 logical slots after own CREATE; empty slots have item_guid0.
  repeated EquipmentSlotState self_equipment = 43;
  // Absent when unobserved, foreign, bones, or multiple own corpses disagree.
  CorpseState own_corpse = 44;
  // Client-written estimate used only to rank/cache observations. Raw Self and
  // observed distance fields remain server-only and retain their original ages.
  DiscoveryAnchor discovery_anchor = 45;
  // Actual same-map non-bones corpses, bounded by the existing 32-entry cache.
  // Consumers must establish current group membership before targeting one.
  repeated CorpseState player_corpses = 46;
  // Session-local world visit. Advances on each valid login verification or
  // new-world packet, including a same-map transfer. Zero while unbound.
  uint64 visit_revision = 47;
  OwnMovementFacts self_movement_facts = 48;
  OwnSplineFacts self_spline_facts = 49;
  OwnMotionAuthority self_motion_authority = 50;
  SplineCompletionObservation spline_completion = 51;
  WorldTransferObservation world_transfer = 52;
  // PRIVATE PLAYER_AMMO_ID, from this authenticated body's own update fields only.
  bool self_ammo_known = 53;
  uint32 self_ammo_entry = 54;
  uint64 self_ammo_revision = 55;
  // PRIVATE PLAYER_XP / PLAYER_NEXT_LEVEL_XP for this authenticated body only.
  // Current-level counter and next-level threshold, not cumulative/remaining XP.
  // CREATE establishes omitted zero values; login/visit loss is unknown until
  // a new own CREATE or explicit field update. No XP table or gain is inferred.
  bool self_xp_known = 56;
  uint32 self_xp = 57;
  bool self_next_level_xp_known = 58;
  uint32 self_next_level_xp = 59;
  // Advances only when own XP values or their knownness change.
  uint64 self_xp_revision = 60;
  repeated SpellGroundEffect ground_effects = 61;
  bool ground_effects_supported = 62;
  // At least one area observation was omitted by the bounded cache this visit.
  bool ground_effects_overflow = 63;
  // All currently observed creatures fit the nearby list and its backing cache.
  // An evicted creature can remain visible until this visit ends.
  bool nearby_creatures_complete = 64;
  // At most 32 actually observed summoning rituals (18) and meeting stones (23).
  repeated GameObjectState summoning_objects = 65;
}

// Passive server combat packet evidence for exactly one authenticated session.
// Sequences are session-local and retained without a packet-count eviction cap.
message CombatEventsRequest {
  string session_id = 1;
  uint64 after_sequence = 2;
  // Page size only; zero uses 128. This never limits journal retention.
  uint32 limit = 3;
}
message CombatEvent {
  uint64 sequence = 1;
  uint64 received_at_unix_ms = 2;
  uint32 opcode = 3;
  // melee_damage, spell_damage, heal, cast_start, cast_go, cast_failure,
  // death, or unknown. cast_go means launched, never a confirmed effect.
  string kind = 4;
  uint64 source_guid = 5;
  uint64 target_guid = 6;
  uint32 spell_id = 7;
  bool amount_known = 8;
  uint32 amount = 9;
  bool result_known = 10;
  uint32 result = 11;
  // Exact received game packet body, including unsupported/malformed bodies.
  bytes raw_payload = 12;
  bool malformed = 13;
  string detail = 14;
}
message CombatEventGap {
  uint64 from_sequence = 1;
  uint64 through_sequence = 2;
  // cursor_ahead, or durability_unavailable (events remain readable in RAM).
  string reason = 3;
}
message CombatEventsResponse {
  string session_id = 1;
  uint64 self_guid = 2;
  uint64 first_sequence = 3;
  uint64 latest_sequence = 4;
  uint64 next_sequence = 5;
  bool has_more = 6;
  repeated CombatEvent events = 7;
  repeated CombatEventGap gaps = 8;
}

service BuddyWorld {
  rpc RetireSplineCompletion(RetireSplineCompletionRequest) returns (SplineCompletionObservation);
  rpc AdoptSplineTransfer(AdoptSplineTransferRequest) returns (SplineCompletionObservation);
  rpc CompleteSpline(CompleteSplineRequest) returns (SplineCompletionObservation);
  rpc CombatEvents(CombatEventsRequest) returns (CombatEventsResponse);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc ObserveClientMovement(ClientMovementRequest) returns (google.protobuf.Empty);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
}
