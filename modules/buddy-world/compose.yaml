services:
  module:
    build:
      context: ../..
      dockerfile: modules/buddy-world/Dockerfile
    network_mode: none
    read_only: true
    environment:
      BUDDY_INDEPENDENT: ${BUDDY_INDEPENDENT:-false}
    volumes:
      - combat-events:/var/lib/buddy-combat-events
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

# Shared append-only session files survive ordinary character/module restarts.
volumes:
  combat-events:
    name: agent-wow-combat-events
