script_api:
  combat_events: {effect: read}
  snapshot: {effect: read}
  complete_spline:
    effect: mutation
    description: Report one due scoped taxi spline using received MovementInfo and an inferred advertised endpoint; a transport write does not establish arrival.
  retire_spline_completion:
    effect: mutation
    description: Retain ACK delivery uncertainty while retiring its reservation against exact new actual ground observations; proves no destination arrival.
  adopt_spline_transfer:
    effect: mutation
    description: Supersede one completion slot from an exact observed adjacent transfer while retaining its original delivery uncertainty; no packet or arrival claim.
