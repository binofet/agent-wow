services:
  module:
    build:
      context: ../..
      dockerfile: modules/buddy-chat/Dockerfile
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
