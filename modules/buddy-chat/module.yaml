api_version: 1
enabled: true
description: Explicit SAY/PARTY sends and cursor-based player SAY/PARTY/WHISPER polling; no automatic replies
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  send: /warcraftbuddy.chat.v1.BuddyChat/Send
  poll: /warcraftbuddy.chat.v1.BuddyChat/Poll
packets:
  SMSG_MESSAGECHAT: /warcraftbuddy.chat.v1.BuddyChat/OnPacket
