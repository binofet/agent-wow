syntax = "proto3";

package warcraftbuddy.chat.v1;
option go_package = "github.com/agent-wow/agent-wow/modules/buddy-chat/api;chatv1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

// Values match WoW 3.3.5a ChatMsg. WHISPER_INFORM is receive-only.
enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  SAY = 1;
  PARTY = 2;
  WHISPER = 7;
  WHISPER_INFORM = 9;
  PARTY_LEADER = 51;
}

// Specify a language your character knows. Universal (0) is not sent.
enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  ORCISH = 1;
  COMMON = 7;
}

// Allowlisted EmotesText.dbc IDs, not arbitrary animation IDs.
enum Emote {
  EMOTE_UNSPECIFIED = 0;
  BOW = 17;
  CHEER = 21;
  WAVE = 101;
}

message EmoteRequest {
  Emote emote = 1;
  // 0 means untargeted. Nonzero targets must be player GUIDs; the server
  // resolves their presence/range. Does not turn or move the character.
  uint64 target_guid = 2;
}

message SendRequest {
  Channel channel = 1;
  Language language = 2;
  // Plain UTF-8 text, 1–255 bytes; no controls, WoW markup, or .command/!command.
  string text = 3;
  // Required only for WHISPER. A plain character name, never a command/channel.
  string recipient = 4;
}

message SendResponse {
  // Transport write only: server acceptance/delivery/animation is not confirmed.
  bool transport_written = 1;
}

message PollRequest {
  // Exclusive, session-local sequence cursor. Start with 0.
  uint64 after_sequence = 1;
  // 0 means 50; maximum 256. Polling does not remove messages.
  uint32 limit = 2;
  // Optional binding to the previously observed module session. A mismatch
  // rejects the cursor even when the new session has already caught up to it.
  string session_id = 3;
}

message Message {
  uint64 sequence = 1;
  Channel channel = 2;
  // Wire language; incoming universal (0) is valid. Addon traffic is ignored.
  int32 language = 3;
  uint64 sender_guid = 4;
  uint64 receiver_guid = 5;
  string text = 6;
  uint32 chat_tag = 7;
  // Server echoes are retained and identified so callers can avoid replying.
  bool self = 8;
}

message PollResponse {
  repeated Message messages = 1;
  // Last returned sequence, or the input cursor when no messages were returned.
  uint64 next_sequence = 2;
  uint64 oldest_sequence = 3;
  uint64 latest_sequence = 4;
  // True when messages after the requested cursor were overwritten.
  bool cursor_lost = 5;
  uint64 ignored_packets = 6;
  uint64 malformed_packets = 7;
  string session_id = 8;
}

// A bounded owner-addon report, separate from the conversational chat ring.
// State: 0 incomplete, 1 complete, 2 failed, as reported by Joel's normal UI.
message OwnerQuestState {
  uint32 quest_id = 1;
  uint32 state = 2;
}

// Addon-correlated UI requests and quest-log changes. These are owner reports,
// not independent server reward receipts for this companion.
message OwnerQuestEvent {
  uint32 quest_id = 1;
  uint64 npc_guid = 2;
  uint64 age_ms = 3;
}

// Read-only normal UI comparison evidence. The legacy UI exposes item links,
// not full owned item GUIDs; these slots never authorize moving owner's items.
message OwnerEquipmentSlot {
  uint32 slot = 1;
  bool slot_known = 2;
  uint32 entry = 3;
  bool metadata_known = 4;
  bool enhancements_known = 5;
  bool has_enhancements = 6;
  bool durability_known = 7;
  uint32 durability = 8;
  uint32 max_durability = 9;
}
message OwnerProficiency {
  uint32 skill_id = 1;
  bool known = 2;
}
message OwnerGear {
  bool available = 1;
  string addon_session = 2;
  uint32 revision = 3;
  uint64 age_ms = 4;
  bool gear_known = 5;
  uint32 equipment_revision = 6;
  bool class_known = 7;
  uint32 class_id = 8;
  bool race_known = 9;
  uint32 race_id = 10;
  bool level_known = 11;
  uint32 level = 12;
  repeated OwnerEquipmentSlot slots = 13;
  bool proficiencies_known = 14;
  repeated OwnerProficiency proficiencies = 15;
  // Weapon/armor proficiency evidence does not assert profession skill ranks.
  bool skills_known = 16;
}

message OwnerFeedResponse {
  // A complete, validated snapshot has arrived. Callers must check age_ms.
  bool available = 1;
  string body_session_id = 2;
  string addon_session = 3;
  uint32 revision = 4;
  uint64 age_ms = 5;
  uint32 level = 6;
  repeated OwnerQuestState quests = 7;
  repeated OwnerQuestEvent rewarded = 8;
  repeated OwnerQuestEvent accepted = 9;
  uint64 received_packets = 10;
  uint64 malformed_packets = 11;
  uint64 ignored_packets = 12;
  uint64 incomplete_batches = 13;
  bool assembling = 14;
  // Positive IDs from the normal client's completed-query cache, at most64.
  // Omission from this bounded report does not prove a quest uncompleted.
  repeated uint32 completed_quest_ids = 15;
  OwnerGear owner_gear = 16;
}

enum TeamAction {
  TEAM_ACTION_UNSPECIFIED = 0;
  RESET = 1;
  UNSTUCK = 2;
}

// Fixed host observations, never arbitrary UI text or a command interpreter.
enum TeamPhase {
  TEAM_PHASE_UNSPECIFIED = 0;
  ONLINE = 1;
  OFFLINE = 2;
  FOLLOWING = 3;
  FIGHTING = 4;
  HEALING = 5;
  BUFFING = 6;
  LOOTING = 7;
  GATHERING = 8;
  MANAGING_SKILLS = 9;
  MANAGING_GEAR = 10;
  SELLING_TRASH = 11;
  MAIL = 12;
  BUSY = 13;
  REQUESTED = 14;
  DEFERRED_COMBAT = 15;
  STOPPING = 16;
  STARTING = 17;
  READY = 18;
  UNSTUCK_ROUTING = 19;
  NEEDS_GM_HELP = 20;
  FAILED = 21;
  OUTCOME_UNCONFIRMED = 22;
  COMPLETE = 23;
}

message ManagementRequestsRequest {
  // Chat-module epoch, distinct from the core body SID. Empty only to discover.
  string session_id = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3; // 0 means32; at most64. Reading never consumes a request.
}
message ManagementRequest {
  uint64 sequence = 1;
  // Stable across relays: owner addon nonce + "." + owner request sequence.
  string request_id = 2;
  string addon_session = 3;
  uint32 request_sequence = 4;
  uint64 subject_guid = 5;
  TeamAction action = 6;
  uint64 age_ms = 7;
  bool available = 8; // Only while age<30seconds in this receiving epoch.
}
message ManagementRequestsResponse {
  string session_id = 1;
  uint64 self_guid = 2;
  repeated ManagementRequest requests = 3;
  uint64 next_sequence = 4;
  uint64 oldest_sequence = 5;
  uint64 latest_sequence = 6;
  bool cursor_lost = 7;
  uint64 received_packets = 8;
  uint64 ignored_packets = 9;
  uint64 malformed_packets = 10;
}
message TeamStatusRequest {
  string session_id = 1; // Exact receiving chat-module epoch.
  uint64 subject_guid = 2; // Fixed1/4/5/8, including an offline peer.
  TeamPhase phase = 3;
  // Optional exact request reference. A generic activity never settles a request.
  string request_addon_session = 4;
  uint32 request_sequence = 5;
  uint32 observation_age_ms = 6; // At most5000; reduces fixed15second UI TTL.
}
message TeamStatusResponse {
  bool transport_written = 1; // Neither addon delivery nor lifecycle completion.
  uint32 sequence = 2;
  uint32 ttl_seconds = 3;
  string session_id = 4;
  uint64 subject_guid = 5;
  TeamPhase phase = 6;
}

service BuddyChat {
  rpc Send(SendRequest) returns (SendResponse);
  rpc Emote(EmoteRequest) returns (SendResponse);
  rpc Poll(PollRequest) returns (PollResponse);
  rpc OwnerFeed(google.protobuf.Empty) returns (OwnerFeedResponse);
  rpc ManagementRequests(ManagementRequestsRequest) returns (ManagementRequestsResponse);
  rpc PublishTeamStatus(TeamStatusRequest) returns (TeamStatusResponse);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
}
