# Copy to companions.toml and select profiles already staged on the target.
# Direct model APIs only. This file contains no credentials or model download.
version = 1
default_host = "laniakea"

[hosts.laniakea]
address = "192.168.1.152"
user = "jmax"
root = "/home/jmax/dev/agent-wow"
python = "python3"
# Set local=true only when running this script on this actual host if its
# hostname differs from 'laniakea'. Otherwise the frontend delegates over SSH.

[native_env]
AGENT_WOW_AUTHSERVER_HOST = "10.247.37.1"

[model]
provider = "local"
base_url = "http://127.0.0.1:18765/v1"
model = "nvidia/nemotron-3.5-super-vl"
# LM Studio is called directly using its OpenAI-compatible API.
# Other local OpenAI-compatible servers can use an explicit base_url/model.
# Actors default to banter_seconds=0; set 120..3600 per actor to opt in.

[actors.arlen]
name = "Arlen"
guid = 1
class = "priest"
profile = "default"
native_profile = "default"
native_port = 8086
state_dir = "data/converse"

[actors.mira]
name = "Mira"
guid = 4
class = "mage"
profile = "mira"
native_port = 8087

[actors.rook]
name = "Rook"
guid = 5
class = "rogue"
profile = "rook"
native_port = 8088

[actors.nixwick]
name = "Nixwick"
guid = 8
class = "warlock"
profile = "nixwick"
native_profile = "alliance-nixwick"
native_port = 8402

# Optional direct paid APIs; opt in with ONE complete per-actor override.
# Replace each model placeholder with an actual ID from your provider account.
# Only the named key environment variable is read. No local->paid fallback.
# [actors.mira.model]
# provider = "claude"
# base_url = "https://api.anthropic.com/v1"
# model = "REPLACE_WITH_YOUR_CLAUDE_MODEL_ID"
# api_key_env = "ANTHROPIC_API_KEY"   # Variable name, never its value
#
# [actors.mira.model]
# provider = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta"
# model = "REPLACE_WITH_YOUR_GEMINI_MODEL_ID"
# api_key_env = "GEMINI_API_KEY"
#
# [actors.mira.model]
# provider = "openai"
# base_url = "https://api.openai.com/v1"
# model = "REPLACE_WITH_YOUR_OPENAI_MODEL_ID"
# api_key_env = "OPENAI_API_KEY"
#
# New companions never use Codex CLI, a gateway or a paid provider fallback.
# Native runtime-release.json remains authoritative for the coherent binary,
# module directory, Lua source and private protocol contracts per profile.
