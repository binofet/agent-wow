# Optional existing LiteLLM service. Local LM Studio does not use this file.
# Official Responses translation: https://docs.litellm.ai/docs/harness/codex
# Replace both upstream placeholders with model IDs from your provider accounts;
# these placeholders are not runnable models. The aliases stay fixed.
model_list:
  - model_name: claude
    litellm_params:
      model: anthropic/REPLACE_WITH_YOUR_CLAUDE_MODEL_ID
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gemini
    litellm_params:
      model: gemini/REPLACE_WITH_YOUR_GEMINI_MODEL_ID
      api_key: os.environ/GEMINI_API_KEY
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
router_settings:
  num_retries: 0
  fallbacks: []
