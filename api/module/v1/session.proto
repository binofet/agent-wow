syntax = "proto3";

package agentwow.module.v1;
option go_package = "github.com/agent-wow/agent-wow/pkg/modules/v1;modv1";

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

// WorldPacket carries an unchanged worldserver packet to a subscribed handler.
message WorldPacket {
  uint32 opcode = 1;
  bytes payload = 2;
  // Immutable transport correlation captured before this packet is queued.
  // Absent on older hosts; absence never authorizes a scoped completion.
  TransportScope transport_scope = 3;
}

// SendPacketRequest carries one outbound gameplay packet without transport framing.
message SendPacketRequest {
  uint32 opcode = 1;
  bytes payload = 2;
  // Optional for legacy gameplay packets; required for spline completion.
  TransportScope transport_scope = 3;
}

// Transport-owned observations, not destination, route or arrival authority.
// Spline fields describe the latest observed standalone own spline header.
// A consumer must also validate the complete World parser's current facts at
// motion_revision; CREATE-only or malformed source cannot reuse an old header.
message TransportScope {
  string connection_id = 1;
  uint64 self_guid = 2;
  bool visit_bound = 3;
  uint64 visit_revision = 4;
  uint32 map_id = 5;
  uint64 motion_revision = 6;
  bool spline_id_known = 7;
  uint32 spline_id = 8;
  // Advances for a distinct observed source, including reused ID zero.
  // Exact header retransmissions coalesce and cannot restore a consumed write.
  uint64 spline_revision = 9;
  uint64 spline_source_revision = 10;
  bool spline_active = 11;
  uint32 spline_source_opcode = 12;
  // Latest immediate observed transfer edge. It proves neither taxi booking
  // causality nor arrival and never replaces this scope's current binding.
  ObservedWorldTransfer world_transfer = 13;
  // Set only on a received summon request and its matching response.
  uint64 summon_offer_sequence = 14;
  // Target-dependent game-object use must still agree with the socket's latest UI selection.
  uint64 meeting_stone_target_guid = 15;
  // Set only on a natural-landing menu request and a matching menu physically
  // received after that request was written. Not an acknowledgement of arrival.
  uint64 taxi_arrival_query_revision = 16;
}

// Flat owner-ordered protocol observations, not a route or a visit history.
// Known requires an exact supported Pending, matching NewWorld and known ACK
// write. There is no server acknowledgement of the ACK or booking identifier.
message ObservedWorldTransfer {
  uint64 revision = 1;
  string phase = 2;
  bool known = 3;
  string connection_id = 4;
  uint64 self_guid = 5;
  uint64 from_visit_revision = 6;
  uint32 from_map_id = 7;
  uint64 from_motion_revision = 8;
  bool from_spline_id_known = 9;
  uint32 from_spline_id = 10;
  uint64 from_spline_revision = 11;
  uint64 from_spline_source_revision = 12;
  uint32 from_spline_source_opcode = 13;
  bool from_spline_active = 14;
  uint64 pending_motion_revision = 15;
  uint32 target_map_id = 16;
  uint64 to_visit_revision = 17;
  uint32 to_map_id = 18;
  uint64 entry_motion_revision = 19;
  uint64 worldport_ack_motion_revision = 20;
  bool worldport_ack_written = 21;
  bool worldport_ack_unknown = 22;
  bool completion_report_written = 23;
  uint64 completion_report_motion_revision = 24;
  string reason = 25;
  bool target_map_known = 26;
}

// ClockResponse samples the clock shared by modules and core time-sync replies.
message ClockResponse {
  // Milliseconds from the session's monotonic origin, modulo 2^32.
  uint32 client_time_ms = 1;
}

// InvokeModuleRequest selects a manifest-listed method on a direct dependency.
message InvokeModuleRequest {
  string module = 1;
  string method = 2;
  google.protobuf.Any request = 3;
}

// InvokeModuleResponse carries the typed result without JSON conversion.
message InvokeModuleResponse {
  google.protobuf.Any result = 1;
}

// Session exposes callbacks on each module's session-owned socket.
service Session {
  // SendPacket confirms a transport write, not server acceptance. Never retry automatically.
  rpc SendPacket(SendPacketRequest) returns (google.protobuf.Empty);
  // GetClock returns the shared monotonic session clock.
  rpc GetClock(google.protobuf.Empty) returns (ClockResponse);
  // InvokeModule forwards a typed call to a dependency. Preserve ctx for nested calls.
  rpc InvokeModule(InvokeModuleRequest) returns (InvokeModuleResponse);
}
