name: CI

on:
  push:
    branches: [main, 'buddy/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check development launchers
        run: |
          bash -n run
          python3 -B -c 'from pathlib import Path; [compile(p.read_text(), str(p), "exec") for p in (Path("dev/realm"), Path("dev/buddy"), Path("dev/converse"), Path("dev/sync-quests"), Path("dev/party-quests"), Path("dev/party-maintenance"))]'
          REALM_DB_ROOT_PASSWORD=ci-validation-only docker compose --file dev/realm.compose.yaml config --quiet

      - name: Test buddy launcher lifecycle
        run: python3 -B dev/test_buddy.py

      - name: Build evaluator and test shared quest reward policy
        run: |
          go build -o data/bin/luapolicy ./cmd/luapolicy
          export BUDDY_LUAPOLICY_TEST_BINARY="$GITHUB_WORKSPACE/data/bin/luapolicy"
          python3 -B dev/test_quest_rewards.py
          python3 -B dev/test_starter_rewards_policy.py
          python3 -B dev/test_starter_objective_policy.py
          python3 -B dev/test_starter_pickup_policy.py
          python3 -B dev/test_expedition_policy.py \
            ExpeditionTests.test_single_omitted_zero_choice_and_multiple_choices_block \
            ExpeditionTests.test_multiple_rewards_choose_actual_index_by_known_total_value_and_wait_exact_receipt \
            ExpeditionTests.test_reward_metadata_unknown_or_malformed_offer_never_claims \
            ExpeditionTests.test_reward_value_tie_uses_omitted_zero_index_and_composition_catalog \
            ExpeditionTests.test_shared_useful_reward_policy_claims_exact_choice_and_keeps_uncertain_receipt
          python3 -B dev/test_task_runtime.py

      - name: Test in-game conversation loop
        run: python3 -B dev/test_converse.py

      - name: Test companion repair queue and review gates
        run: |
          python3 -B dev/test_workshop.py
          python3 -B dev/test_behavior.py

      - name: Test automatic starter quest synchronization
        run: python3 -B dev/test_sync_quests.py

      - name: Test ongoing party quest synchronization
        run: |
          export BUDDY_LUAPOLICY_TEST_BINARY="$GITHUB_WORKSPACE/data/bin/luapolicy"
          python3 -B dev/test_party_quest_policy.py
          python3 -B dev/test_party_quests.py

      - name: Test training and stipend maintenance
        run: python3 -B dev/test_party_maintenance.py

      - name: Test Lua party disenchant decisions
        run: |
          go build -o "${RUNNER_TEMP}/luapolicy" ./cmd/luapolicy
          BUDDY_LUAPOLICY_TEST_BINARY="${RUNNER_TEMP}/luapolicy" python3 -B dev/test_party_disenchant.py

      - name: Test observed Lua group rolls
        run: |
          BUDDY_LUAPOLICY_TEST_BINARY="${RUNNER_TEMP}/luapolicy" python3 -B dev/test_loot_roll_policy.py
          go build -o "${RUNNER_TEMP}/buddy-inventory" ./modules/buddy-inventory/cmd
          BUDDY_INVENTORY_PACKAGED_BINARY="${RUNNER_TEMP}/buddy-inventory" go test -race -count=1 ./pkg/modules/runtime -run '^TestPackagedInventoryObservedLuaRoll$'

      - name: Test legacy client quest addon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 dev/test_quest_addon.lua addons/WarcraftBuddyQuestSync/WarcraftBuddyQuestSync.lua

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout=5m ./...

      - name: Build
        run: ./run build
