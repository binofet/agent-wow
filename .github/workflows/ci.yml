name: CI

on:
  push:
    branches: [main, 'buddy/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check development launchers
        run: |
          bash -n run
          python3 -B -c 'from pathlib import Path; [compile(p.read_text(), str(p), "exec") for p in (Path("dev/realm"), Path("dev/buddy"), Path("dev/converse"), Path("dev/sync-quests"), Path("dev/party-quests"))]'
          REALM_DB_ROOT_PASSWORD=ci-validation-only docker compose --file dev/realm.compose.yaml config --quiet

      - name: Test buddy launcher lifecycle
        run: python3 -B dev/test_buddy.py

      - name: Test in-game conversation loop
        run: python3 -B dev/test_converse.py

      - name: Test automatic starter quest synchronization
        run: python3 -B dev/test_sync_quests.py

      - name: Test ongoing party quest synchronization
        run: python3 -B dev/test_party_quests.py

      - name: Test legacy client quest addon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 dev/test_quest_addon.lua addons/WarcraftBuddyQuestSync/WarcraftBuddyQuestSync.lua

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout=5m ./...

      - name: Build
        run: ./run build
